<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --red: #CC0000; --black: #0C0C0C; --off-white: #F7F6F4; --mid-grey: #E8E6E2; --text-muted: #7A7570; --text-body: #2A2825; }
  html { scroll-behavior: smooth; }
  body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text-body); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--red); color: white; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--off-white); }
  ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes slideUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes scaleIn { from { opacity:0; transform:scale(0.96); } to { opacity:1; transform:scale(1); } }
  
  @page { size: letter portrait; margin: 0.4in; }
  @media print {
    html, body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    nav, .no-print { display: none !important; }
  }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .print-build { break-inside: avoid; page-break-inside: avoid; }
  .print-cover { break-after: page; page-break-after: always; }

  /* Batch 6 — responsive + a11y */
  @media (max-width: 900px) {
    /* Generic 3-column → 1-column collapse for product / build / blog grids */
    [style*="grid-template-columns: repeat(4,"], [style*="grid-template-columns:repeat(4,"],
    [style*="grid-template-columns: repeat(4,"], [style*="grid-template-columns:repeat(4,"],
    [style*="gridTemplateColumns: repeat(4", [style*="gridTemplateColumns:repeat(4"], [style*="gridTemplateColumns: repeat(3"], [style*="gridTemplateColumns:repeat(4"], [style*="gridTemplateColumns:repeat(4"], [style*="gridTemplateColumns:repeat(4"], [style*="gridTemplateColumns:repeat(3"] {
      grid-template-columns: 1fr !important;
    }
    /* Two-column layouts collapse to one */
    [style*="grid-template-columns: 1fr 1fr"], [style*="grid-template-columns:1fr 1fr"] {
      grid-template-columns: 1fr !important;
    }
    /* Drop the sticky sidebar position on small screens */
    [style*="position: sticky"], [style*="position:sticky"] {
      position: static !important;
    }
    /* Reduce nav padding on small screens */
    nav > div { padding: 0 16px !important; gap: 12px !important; }
    /* Page-level padding tighten */
    section, main, footer > div, .kbd-page { padding-left: 16px !important; padding-right: 16px !important; }
  }
  @media (max-width: 640px) {
    /* Hide desktop nav links, show hamburger */
    nav > div { padding: 0 12px !important; gap: 8px !important; }
    .nav-links { display: none !important; }
    .nav-hamburger { display: flex !important; }
    .nav-desktop-only { display: none !important; }
    /* Page-level padding tighten */
    section, main, footer > div { padding-left: 16px !important; padding-right: 16px !important; }
  }

  /* Hamburger — hidden by default, shown on mobile */
  .nav-hamburger { display: none; }
  /* Dropdown panel */
  .nav-dropdown a {
    display: block; padding: 14px 24px; color: #ccc;
    font-size: 14px; font-weight: 500; text-decoration: none;
    letter-spacing: 0.04em; border-bottom: 1px solid #1a1a1a;
    transition: color 0.15s;
  }
  .nav-dropdown a:hover, .nav-dropdown a:active { color: white; background: #111; }

  /* 6.4 Focus-visible — visible keyboard focus, not on click */
  *:focus { outline: none; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
  textarea:focus-visible, [role="button"]:focus-visible {
    outline: 2px solid var(--red);
    outline-offset: 2px;
    border-radius: 4px;
  }
  /* Light-surface elements need a dark focus ring instead */
  input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline-color: var(--black);
  }

  /* 6.3 — Ensure body text on dark surfaces is at least rgba(255,255,255,0.7) */
  /* (handled per-element where critical; this is informational)*/

</style>

// ── LIGHTBOX ───────────────────────────────────────────────────────────────
function Lightbox({ build, onClose }) {
  const [activePhoto, setActivePhoto] = useState(0);
  const [imgErr, setImgErr] = useState({});

  useEffect(() => {
    const onKey = e => { if(e.key==='Escape') onClose(); if(e.key==='ArrowRight') setActivePhoto(p=>(p+1)%build.photos.length); if(e.key==='ArrowLeft') setActivePhoto(p=>(p-1+build.photos.length)%build.photos.length); };
    document.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  }, [build, onClose]);

  return (
    <div onClick={onClose} style={{
      position:'fixed', inset:0, background:'rgba(0,0,0,0.92)', zIndex:9999,
      display:'flex', alignItems:'center', justifyContent:'center',
      animation:'fadeIn 0.2s ease', padding:'24px'
    }}>
      <div onClick={e=>e.stopPropagation()} style={{
        background:'var(--black)', borderRadius:'20px', overflow:'hidden',
        width:'100%', maxWidth:'1100px', maxHeight:'92vh', display:'flex', flexDirection:'column',
        animation:'scaleIn 0.25s ease', border:'1px solid #2a2a2a'
      }}>
        {/* Header */}
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'20px 28px', borderBottom:'1px solid #1e1e1e', flexShrink:0 }}>
          <div>
            <div style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'24px', color:'white', textTransform:'uppercase', lineHeight:1 }}>{build.car}</div>
            <div style={{ color:'#666', fontSize:'13px', marginTop:'4px' }}>Build by <span style={{color:'rgba(255,255,255,0.6)',fontWeight:600}}>{build.owner}</span> · {build.location} · {build.date}</div>
          </div>
          <button aria-label="Close" onClick={onClose} style={{ background:'rgba(255,255,255,0.08)', border:'none', borderRadius:'8px', color:'#888', width:'36px', height:'36px', cursor:'pointer', fontSize:'18px', display:'flex', alignItems:'center', justifyContent:'center' }}>×</button>
        </div>

        {/* Scrollable body */}
        <div style={{ overflowY:'auto', flex:1 }}>
          {/* Main image */}
          <div style={{ position:'relative', background:'#111', aspectRatio:'16/9' }}>
            {!imgErr[activePhoto] ? (
              <img src={U(build.photos[activePhoto], 1200)} alt={build.car}
                onError={()=>setImgErr(e=>({...e,[activePhoto]:true}))}
                style={{ width:'100%', height:'100%', objectFit:'cover', display:'block' }}/>
            ) : (
              <div style={{ width:'100%', height:'100%', display:'flex', alignItems:'center', justifyContent:'center', color:'#444', fontSize:'13px' }}>Photo unavailable</div>
            )}
            {/* Nav arrows */}
            {build.photos.length > 1 && (
              <>
                <button aria-label="Previous photo" onClick={()=>setActivePhoto(p=>(p-1+build.photos.length)%build.photos.length)} style={{ position:'absolute', left:'16px', top:'50%', transform:'translateY(-50%)', background:'rgba(0,0,0,0.6)', border:'none', borderRadius:'50%', width:'44px', height:'44px', cursor:'pointer', color:'white', fontSize:'20px', display:'flex', alignItems:'center', justifyContent:'center', backdropFilter:'blur(4px)' }}>‹</button>
                <button aria-label="Next photo" onClick={()=>setActivePhoto(p=>(p+1)%build.photos.length)} style={{ position:'absolute', right:'16px', top:'50%', transform:'translateY(-50%)', background:'rgba(0,0,0,0.6)', border:'none', borderRadius:'50%', width:'44px', height:'44px', cursor:'pointer', color:'white', fontSize:'20px', display:'flex', alignItems:'center', justifyContent:'center', backdropFilter:'blur(4px)' }}>›</button>
                <div style={{ position:'absolute', bottom:'16px', left:'50%', transform:'translateX(-50%)', display:'flex', gap:'6px' }}>
                  {build.photos.map((_,i) => (
                    <button key={i} onClick={()=>setActivePhoto(i)} style={{ width: i===activePhoto?'20px':'6px', height:'6px', borderRadius:'3px', background:i===activePhoto?'white':'rgba(255,255,255,0.4)', border:'none', cursor:'pointer', transition:'all 0.2s', padding:0 }}/>
                  ))}
                </div>
              </>
            )}
          </div>

          {/* Thumbnails */}
          <div style={{ display:'flex', gap:'8px', padding:'16px 24px', background:'#0a0a0a', borderBottom:'1px solid #1e1e1e' }}>
            {build.photos.map((photoId, i) => (
              <div key={i} onClick={()=>setActivePhoto(i)} style={{
                width:'72px', height:'52px', borderRadius:'6px', overflow:'hidden', cursor:'pointer', flexShrink:0,
                border: `2px solid ${i===activePhoto?'var(--red)':'transparent'}`, transition:'border-color 0.15s'
              }}>
                {!imgErr[i] ? (
                  <img src={U(photoId,200)} alt="" onError={()=>setImgErr(e=>({...e,[i]:true}))} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                ) : (
                  <div style={{width:'100%',height:'100%',background:'#222'}}/>
                )}
              </div>
            ))}
          </div>

          {/* Caption */}
          <div style={{ padding:'24px 28px', borderBottom:'1px solid #1e1e1e' }}>
            <p style={{ color:'rgba(255,255,255,0.55)', fontSize:'14px', lineHeight:1.75, fontStyle:'italic' }}>
              "{build.caption}"
            </p>
          </div>

          {/* Parts used */}
          <div style={{ padding:'24px 28px' }}>
            <div style={{ fontSize:'11px', letterSpacing:'0.18em', textTransform:'uppercase', color:'var(--red)', fontWeight:700, marginBottom:'16px' }}>
              This Build Uses the Following KBD Parts
            </div>
            <div style={{ display:'grid', gridTemplateColumns:`repeat(${Math.min(build.parts.length,3)}, 1fr)`, gap:'12px' }}>
              {build.parts.map((part, i) => (
                <a key={i} href={`KBD_Product.html?id=${part.id}`} style={{ textDecoration:'none', display:'flex', alignItems:'center', gap:'12px', padding:'14px 16px', background:'rgba(255,255,255,0.04)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:'10px', transition:'all 0.15s', cursor:'pointer' }}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor='rgba(204,0,0,0.4)';e.currentTarget.style.background='rgba(204,0,0,0.06)';}}
                  onMouseLeave={e=>{e.currentTarget.style.borderColor='rgba(255,255,255,0.08)';e.currentTarget.style.background='rgba(255,255,255,0.04)';}}>
                  <div style={{ width:'40px', height:'40px', borderRadius:'8px', background:'rgba(255,255,255,0.06)', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
                    <svg width="18" height="18" fill="none" stroke="var(--red)" strokeWidth="1.5" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                  </div>
                  <div style={{ flex:1 }}>
                    <div style={{ color:'white', fontWeight:600, fontSize:'13px', lineHeight:1.3 }}>{part.name}</div>
                    <div style={{ color:'#555', fontSize:'11px', marginTop:'2px' }}>{part.cat}</div>
                  </div>

// ── BUILD CARD ─────────────────────────────────────────────────────────────

        background:'#1a1a1a',

// ── SUBMIT FORM ────────────────────────────────────────────────────────────
function SubmitBuild() {
  const [submitted, setSubmitted] = useState(false);

  const update = (k,v) => setForm(f=>({...f,[k]:v}));

  if (submitted) {
    return (
      <div style={{ textAlign:'center', padding:'48px 0' }}>
        <div style={{ width:'64px', height:'64px', borderRadius:'50%', background:'rgba(204,0,0,0.12)', border:'2px solid var(--red)', display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 20px' }}>
          <svg width="28" height="28" fill="none" stroke="var(--red)" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <h3 style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'28px', textTransform:'uppercase', color:'white', marginBottom:'8px' }}>Build Submitted!</h3>

      </div>
    );
  }

  return (
    <div>
      <TweaksPanel title="Tweaks">
          <TweakSection label="Brand">
            <TweakColor label="Accent" value={tweaks.accentColor} onChange={v=>setTweak('accentColor',v)}/>
          </TweakSection>
          <TweakSection label="Print">
            <TweakSlider label="Auto-Print Delay" value={tweaks.autoPrintDelay} min={0} max={10000} step={500} unit="ms" onChange={v=>setTweak('autoPrintDelay',v)}/>
          </TweakSection>
        </TweaksPanel>
        
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px', marginBottom:'12px' }}>
        {[['name','Your Name (or @handle)','@your_handle'],['car','Vehicle (Year Make Model)','1995 Nissan 240SX S14 Zenki'],['instagram','Instagram Handle','@yourhandle'],['email','Email Address','you@email.com']].map(([key,label,ph])=>(
          <div key={key}>
            <label style={{ display:'block', fontSize:'10px', fontWeight:600, letterSpacing:'0.15em', textTransform:'uppercase', color:'#666', marginBottom:'6px' }}>{label}</label>
            <input value={form[key]} onChange={e=>update(key,e.target.value)} placeholder={ph}
              style={{ width:'100%', background:'rgba(255,255,255,0.06)', border:'1.5px solid rgba(255,255,255,0.1)', borderRadius:'8px', padding:'11px 14px', fontSize:'14px', color:'white', fontFamily:'DM Sans, sans-serif', outline:'none', transition:'border-color 0.15s' }}

        ))}
      </div>
      <div style={{ marginBottom:'16px' }}>
        <label style={{ display:'block', fontSize:'10px', fontWeight:600, letterSpacing:'0.15em', textTransform:'uppercase', color:'#666', marginBottom:'6px' }}>Tell Us About Your Build</label>
        <textarea value={form.caption} onChange={e=>update('caption',e.target.value)} placeholder="What KBD parts did you use? How was the install? Any tips for others?" rows={3}
          style={{ width:'100%', background:'rgba(255,255,255,0.06)', border:'1.5px solid rgba(255,255,255,0.1)', borderRadius:'8px', padding:'11px 14px', fontSize:'14px', color:'white', fontFamily:'DM Sans, sans-serif', resize:'vertical', outline:'none', lineHeight:1.6 }}

      </div>
      <button onClick={()=>isValid&&setSubmitted(true)} style={{
        background: isValid?'var(--red)':'rgba(255,255,255,0.08)',
        color: isValid?'white':'rgba(255,255,255,0.3)',
        border:'none', borderRadius:'10px', padding:'14px 28px',
        fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'16px',
        letterSpacing:'0.06em', textTransform:'uppercase', cursor:isValid?'pointer':'default',
        display:'flex', alignItems:'center', gap:'8px'
      }}>
        Submit My Build
        <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

// Auto-print with reviewer affordance (3s delay + cancel + print-now)
(async () => {
  try { await document.fonts.ready; } catch {}
  const imgs = [...document.images];
  await Promise.all(imgs.map(img => img.complete ? null : new Promise(res => { img.addEventListener('load', res, {once:true}); img.addEventListener('error', res, {once:true}); })));

  // Banner UI
  const banner = document.createElement('div');
  banner.id = 'kbd-print-banner';
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#0C0C0C;color:#fff;padding:14px 24px;font-family:DM Sans,sans-serif;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 4px 20px rgba(0,0,0,0.25);border-bottom:2px solid #CC0000;';
  banner.innerHTML = '<span><strong>Print dialog opens in <span id="kbd-print-countdown">3</span>s.</strong> Review the lookbook below, or use the buttons.</span><div style="display:flex;gap:8px"><button id="kbd-print-cancel" style="background:transparent;border:1.5px solid rgba(255,255,255,0.3);color:#fff;padding:7px 16px;border-radius:6px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;">Cancel</button><button id="kbd-print-now" style="background:#CC0000;border:none;color:#fff;padding:7px 18px;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;letter-spacing:0.04em;">Print Now</button></div>';
  // Don't push the page content down — use position:fixed with no padding adjustment
  document.body.appendChild(banner);

  let cancelled = false;
  let secs = 3;
  const cdEl = banner.querySelector('#kbd-print-countdown');
  const tick = setInterval(() => {
    secs--;
    if (cdEl) cdEl.textContent = secs;
    if (secs <= 0) clearInterval(tick);
  }, 1000);

  const cleanup = () => { clearInterval(tick); banner.remove(); };

  const timer = setTimeout(() => {
    if (cancelled) return;
    cleanup();
    window.print();
  }, 3000);

  banner.querySelector('#kbd-print-cancel').addEventListener('click', () => {
    cancelled = true;
    clearTimeout(timer);
    cleanup();
  });
  banner.querySelector('#kbd-print-now').addEventListener('click', () => {
    clearTimeout(timer);
    cleanup();
    setTimeout(() => window.print(), 100);
  });
})();
</script>
