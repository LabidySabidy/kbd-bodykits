    const offset = ((id - 1) * 3) % DEMO_REVIEWS_POOL.length;
    const picked = [
      DEMO_REVIEWS_POOL[offset],
      DEMO_REVIEWS_POOL[(offset + 1) % DEMO_REVIEWS_POOL.length],
      DEMO_REVIEWS_POOL[(offset + 2) % DEMO_REVIEWS_POOL.length],
    ];
    return { ...p, reviews: picked };
  }
  return p;
}

function PlaceholderImg({ label, aspect='1/1', dark=false, large=false, unsplashId=null, w=800 }) {

      <div style={{ position:'relative', width:'100%', aspectRatio:aspect, overflow:'hidden', background:dark?'#181818':'#e0ddd8', borderRadius:'8px' }}>
        <img src={UNSPLASH(unsplashId,w)} alt={label} onError={()=>setErr(true)} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>

  return (
    <div style={{
      position:'relative', width:'100%', aspectRatio:aspect, background:'#1A1A1A',
      overflow:'hidden', display:'flex', alignItems:'flex-end', justifyContent:'flex-start',

              <div style={{ color:'var(--text-muted)', fontSize:'13px', marginTop:'8px' }}>{product.totalReviews} verified reviews</div>

              {/* Bar chart */}
              <div style={{ marginTop:'24px', display:'flex', flexDirection:'column', gap:'6px' }}>
                {[5,4,3,2,1].map(s => {
                  const pct = s===5?72:s===4?20:s===3?5:s===2?2:1;
                  return (
                    <div key={s} style={{ display:'flex', alignItems:'center', gap:'8px' }}>
                      <span style={{ fontSize:'12px', fontWeight:600, width:'8px', color:'var(--text-muted)' }}>{s}</span>
                      <svg width="10" height="10" viewBox="0 0 12 12"><polygon points="6,1 7.5,4.5 11,5 8.5,7.5 9.2,11 6,9.3 2.8,11 3.5,7.5 1,5 4.5,4.5" fill="var(--red)"/></svg>
                      <div style={{ flex:1, height:'6px', background:'#f0eeeb', borderRadius:'3px', overflow:'hidden' }}>
                        <div style={{ width:`${pct}%`, height:'100%', background:'var(--red)', borderRadius:'3px', transition:'width 0.8s ease' }}/>
                      </div>
                      <span style={{ fontSize:'12px', color:'var(--text-muted)', width:'28px', textAlign:'right' }}>{pct}%</span>
                    </div>
                  );
                })}
              </div>

              {/* Write review */}
              <div style={{ marginTop:'24px', padding:'16px', background:'var(--off-white)', borderRadius:'10px' }}>
                <div style={{ fontWeight:600, fontSize:'13px', marginBottom:'10px' }}>Rate this product</div>
                <Stars rating={reviewStars} size={22} interactive onRate={setReviewStars}/>
                {reviewStars > 0 && (
                  <div style={{ marginTop:'10px', animation:'slideUp 0.2s ease' }}>
                    <textarea placeholder="Share your experience..." style={{ width:'100%', border:'1px solid var(--mid-grey)', borderRadius:'8px', padding:'10px', fontSize:'13px', fontFamily:'DM Sans, sans-serif', resize:'vertical', minHeight:'80px', color:'var(--text-body)' }}/>
                    <button style={{ marginTop:'8px', width:'100%', background:'var(--black)', color:'white', border:'none', borderRadius:'8px', padding:'10px', fontWeight:600, fontSize:'13px', cursor:'pointer', fontFamily:'DM Sans, sans-serif' }}>Submit Review</button>
                  </div>
                )}
              </div>
            </div>

            {/* Review list */}
            <div>
              <div style={{ display:'flex', flexDirection:'column', gap:'24px' }}>
                {product.reviews.map((r,i) => (
                  <div key={i} style={{ paddingBottom:'24px', borderBottom: i<product.reviews.length-1 ? '1px solid var(--mid-grey)' : 'none' }}>
                    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'8px' }}>
                      <div style={{ display:'flex', alignItems:'center', gap:'10px' }}>
                        <div style={{ width:'36px', height:'36px', borderRadius:'50%', background:'var(--off-white)', display:'flex', alignItems:'center', justifyContent:'center', fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'16px', color:'var(--black)' }}>{r.name[0]}</div>
                        <div>
                          <div style={{ fontWeight:700, fontSize:'14px' }}>{r.name}</div>
                          <div style={{ color:'var(--text-muted)', fontSize:'11px' }}>{r.car}</div>
                        </div>
                      </div>
                      <div style={{ color:'var(--text-muted)', fontSize:'12px' }}>{r.date}</div>
                    </div>
                    <Stars rating={r.stars} size={13}/>
                    <p style={{ marginTop:'10px', fontSize:'14px', lineHeight:1.75, color:'var(--text-body)' }}>{r.text}</p>
                    <div style={{ marginTop:'8px', display:'flex', gap:'12px' }}>
                      <button style={{ background:'none', border:'none', cursor:'pointer', color:'var(--text-muted)', fontSize:'12px', display:'flex', alignItems:'center', gap:'4px' }}>
                        <svg width="13" height="13" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24" style={{marginRight:'4px',verticalAlign:'middle'}}><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg> Helpful (12)
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* Related products */}
      <div style={{ padding:'60px 40px 80px', background:'var(--off-white)' }}>
        <div style={{ maxWidth:'1440px', margin:'0 auto' }}>
          <div style={{ fontSize:'11px', letterSpacing:'0.2em', textTransform:'uppercase', color:'var(--red)', fontWeight:700, marginBottom:'10px' }}>Complete Your Build</div>
          <div style={{ display:'flex', alignItems:'flex-end', justifyContent:'space-between', marginBottom:'28px' }}>
            <h2 style={{ fontFamily:'Barlow Condensed, sans-serif', fontSize:'36px', fontWeight:900, textTransform:'uppercase', color:'var(--black)' }}>Pairs Well With</h2>
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:'16px' }}>
            {relatedProducts.map((p,i) => (
              <div key={i} style={{ background:'white', borderRadius:'12px', overflow:'hidden', cursor:'pointer', transition:'box-shadow 0.2s', boxShadow:'0 2px 8px rgba(0,0,0,0.04)' }}
                onMouseEnter={e=>e.currentTarget.style.boxShadow='0 12px 36px rgba(0,0,0,0.1)'}
                onMouseLeave={e=>e.currentTarget.style.boxShadow='0 2px 8px rgba(0,0,0,0.04)'}
              >
                <PlaceholderImg label={p.name} aspect="4/3" unsplashId={['1503376780353-7e6692767b70','1558618666-fcd25c85cd64','1616422396617-b1e80b9698b8','1583121274602-3e2820c69888'][i]} w={400}/>
                <div style={{ padding:'14px 16px 18px' }}>
                  <div style={{ fontSize:'10px', textTransform:'uppercase', letterSpacing:'0.1em', color:'var(--text-muted)', fontWeight:600, marginBottom:'4px' }}>{p.cat}</div>
                  <div style={{ fontWeight:600, fontSize:'14px', marginBottom:'10px' }}>{p.name}</div>
                  <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
                    <span style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:800, fontSize:'22px' }}>${p.price}</span>
                    <button style={{ background:'var(--black)', color:'white', border:'none', borderRadius:'6px', padding:'7px 14px', fontSize:'12px', fontWeight:600, cursor:'pointer' }}>View</button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Sticky add-to-cart bar (appears on scroll) */}
      <StickyCartBar product={product} qty={qty} onAdd={handleAddToCart} added={added}/>
    </div>
  );
}

function StickyCartBar({ product, qty, onAdd, added }) {
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    function onScroll() { setVisible(window.scrollY > 500); }
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  if (!visible) return null;
  return (
    <div style={{
      position:'fixed', bottom:0, left:0, right:0, background:'var(--black)',
      borderTop:'1px solid #2a2a2a', padding:'14px 40px', zIndex:999,
      display:'flex', alignItems:'center', justifyContent:'space-between',
      animation:'slideUp 0.3s ease', boxShadow:'0 -8px 32px rgba(0,0,0,0.3)'
    }}>
      <div style={{ display:'flex', alignItems:'center', gap:'20px' }}>
        <div style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'18px', color:'white', textTransform:'uppercase' }}>{product.name}</div>
        <div style={{ color:'#666', fontSize:'13px' }}>Qty: {qty}</div>
      </div>
      <div style={{ display:'flex', alignItems:'center', gap:'16px' }}>
        <div style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'28px', color:'white' }}>${product.price * qty}</div>
        <button onClick={onAdd} style={{
          background: added?'#2d8a50':'var(--red)', color:'white', border:'none',
          borderRadius:'8px', padding:'12px 28px', fontFamily:'Barlow Condensed, sans-serif',
          fontWeight:900, fontSize:'16px', letterSpacing:'0.06em', textTransform:'uppercase',
          cursor:'pointer', transition:'background 0.3s'
        }}>
          {added ? '✓ Added!' : 'Add to Cart'}
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ProductPage/>);
</script>
</body>
</html>
