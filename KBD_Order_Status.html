<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Your Order — KBD Body Kits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --red: #CC0000; --black: #0C0C0C; --off-white: #F7F6F4; --mid-grey: #E8E6E2; --text-muted: #7A7570; --text-body: #2A2825; --cream: #F5F2EC; }
  html { scroll-behavior: smooth; }
  body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text-body); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--red); color: white; }
  input:focus, select:focus { outline: none; border-color: var(--black) !important; box-shadow: 0 0 0 3px rgba(12,12,12,0.06); }
  @keyframes slideUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

  /* Batch 6 — responsive + a11y */

  /* Mobile responsive rules (placed before @media blocks to avoid CSS parse issues) */

  /* Nav hamburger + dropdown */
  @media (max-width: 640px) {
    nav { overflow-x: hidden; }
    nav > div { flex-wrap: nowrap; }
    nav > div { padding: 0 12px !important; gap: 8px !important; }
    .nav-links { display: none !important; }
    .nav-hamburger { display: flex !important; }
    .nav-desktop-only { display: none !important; }
    section, main, footer > div { padding-left: 16px !important; padding-right: 16px !important; }
  }
  .nav-hamburger { display: none; }
  .nav-dropdown a {
    display: block; padding: 14px 24px; color: #ccc;
    font-size: 14px; font-weight: 500; text-decoration: none;
    letter-spacing: 0.04em; border-bottom: 1px solid #1a1a1a;
    transition: color 0.15s;
  }
  .nav-dropdown a:hover, .nav-dropdown a:active { color: white; background: #111; }


  /* Prevent horizontal overflow on mobile */
  @media (max-width: 900px) {
    body, html { overflow-x: hidden; max-width: 100vw; }
    img, svg, video, canvas { max-width: 100%; height: auto; }
  }

  @media (max-width: 900px) {
    [style*="repeat(4,"] { grid-template-columns: 1fr !important; }
    [style*="repeat(5,"] { grid-template-columns: 1fr !important; }
    [style*="repeat(3,"] { grid-template-columns: 1fr !important; }
    [style*="1fr 1fr"], [style*="1.8fr"] { grid-template-columns: 1fr !important; }
    h2[style*="nowrap"] { white-space: normal !important; }
    [style*="position: sticky"] { position: static !important; }
    nav > div { padding: 0 16px !important; gap: 12px !important; }
    section, main, footer > div, .kbd-page { padding-left: 16px !important; padding-right: 16px !important; }
  }
  @media (max-width: 640px) {
    nav { overflow-x: hidden; }
    nav > div { flex-wrap: nowrap; }
    nav > div { padding: 0 12px !important; gap: 8px !important; }
    section, main, footer > div { padding-left: 16px !important; padding-right: 16px !important; }
  }

  /* Prevent horizontal overflow on mobile */
  @media (max-width: 900px) {
    body, html { overflow-x: hidden; max-width: 100vw; }
    img, svg, video, canvas { max-width: 100%; height: auto; }
  }

  @media (max-width: 900px) {
    /* Generic 3-column → 1-column collapse for product / build / blog grids */
    [style*="grid-template-columns: repeat(4,"], [style*="grid-template-columns:repeat(4,"],
    [style*="grid-template-columns: repeat(4,"], [style*="grid-template-columns:repeat(4,"],
    [style*="gridTemplateColumns: repeat(4", [style*="gridTemplateColumns:repeat(4"], [style*="gridTemplateColumns: repeat(3"], [style*="gridTemplateColumns:repeat(4"], [style*="gridTemplateColumns:repeat(4"], [style*="gridTemplateColumns:repeat(4"], [style*="gridTemplateColumns:repeat(3"] {
      grid-template-columns: 1fr !important;
    }
    /* Two-column layouts collapse to one */
    [style*="grid-template-columns: 1fr 1fr"], [style*="grid-template-columns:1fr 1fr"] {
      grid-template-columns: 1fr !important;
    }
    /* Drop the sticky sidebar position on small screens */
    [style*="position: sticky"], [style*="position:sticky"] {
      position: static !important;
    }
    /* Reduce nav padding on small screens */
    nav > div { padding: 0 16px !important; gap: 12px !important; }
    /* Page-level padding tighten */
    section, main, footer > div, .kbd-page { padding-left: 16px !important; padding-right: 16px !important; }
  }
  @media (max-width: 640px) {
    nav { overflow-x: hidden; }
    nav > div { flex-wrap: nowrap; }
    /* Drop nav items beyond logo + cart */
    nav [data-nav-link] { display: none !important; }
    /* Bigger tap targets */
    
  }

  /* 6.4 Focus-visible — visible keyboard focus, not on click */
  *:focus { outline: none; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
  textarea:focus-visible, [role="button"]:focus-visible {
    outline: 2px solid var(--red);
    outline-offset: 2px;
    border-radius: 4px;
  }
  /* Light-surface elements need a dark focus ring instead */
  input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline-color: var(--black);
  }

  /* 6.3 — Ensure body text on dark surfaces is at least rgba(255,255,255,0.7) */
  /* (handled per-element where critical; this is informational)*/

</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="kbd-shell.jsx"></script>
<script type="text/babel">
const { useState } = React;

const SAMPLE_ORDER = {
  number: 'KBD-2026-0512',
  date: 'May 8, 2026',
  email: 'derek@example.com',
  status: 2, // 0=placed, 1=production, 2=shipped, 3=delivering, 4=delivered
  item: { name: 'VTX Front Bumper', vehicle: '2003–2009 Nissan 350Z Z33', qty: 1, price: 319 },
  carrier: 'FedEx Freight',
  tracking: '1Z999AA1KBD350Z',
  eta: 'May 21, 2026',
};

const STEPS = [
  { label: 'Order Placed',     desc: 'Confirmation sent. Payment authorized.', date: 'May 8' },
  { label: 'In Production',    desc: 'Molded, trimmed, and test-fitted at our Fullerton facility.', date: 'May 11' },
  { label: 'Shipped',          desc: 'Picked up by carrier. Tracking is now active.', date: 'May 14' },
  { label: 'Out for Delivery', desc: 'On the truck. Delivery expected today.', date: 'May 21' },
  { label: 'Delivered',        desc: 'Signed for at your address.', date: '—' },
];

function OrderStatusPage() {
  const [orderNum, setOrderNum] = useState('');
  const [email, setEmail] = useState('');
  const [showResult, setShowResult] = useState(true); // demo: show by default
  const [tracking, setTracking] = useState(false);

  function handleTrack(e) {
    e.preventDefault();
    setTracking(true);
    setTimeout(() => { setShowResult(true); setTracking(false); }, 700);
  }

  return (
    <div>
      <Nav/>

      <section style={{ background:'var(--black)', padding:'72px 40px 56px', position:'relative', overflow:'hidden' }}>
        <div style={{ position:'absolute', inset:0, backgroundImage:`url('https://images.unsplash.com/photo-1605559911160-a3d95d213904?auto=format&fit=crop&w=1920&q=60')`, backgroundSize:'cover', backgroundPosition:'center', opacity:0.16 }}/>
        <div style={{ position:'absolute', inset:0, background:'linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.75) 100%)', pointerEvents:'none' }}/>
        <div style={{ maxWidth:'1100px', margin:'0 auto', position:'relative' }}>
          <div style={{ display:'inline-flex', alignItems:'center', gap:'12px', marginBottom:'20px' }}>
            <span style={{ width:'14px', height:'4px', background:'var(--red)' }}/>
            <span style={{ color:'rgba(255,255,255,0.7)', fontSize:'11px', letterSpacing:'0.22em', textTransform:'uppercase', fontWeight:700 }}>Track Your Order</span>
          </div>
          <h1 style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'clamp(44px,6vw,80px)', color:'white', textTransform:'uppercase', lineHeight:0.92, marginBottom:'14px' }}>
            Where's My Kit?
          </h1>
          <p style={{ color:'rgba(255,255,255,0.55)', fontSize:'15px', lineHeight:1.7, maxWidth:'520px' }}>
            Enter your order number and email below. Tracking updates in real time as your kit moves from our Fullerton mold room to your door.
          </p>
        </div>
      </section>

      <div style={{ maxWidth:'1100px', margin:'0 auto', padding:'48px 40px 80px', display:'grid', gridTemplateColumns:'1fr 320px', gap:'40px', alignItems:'start' }}>
        {/* Main column */}
        <div>
          {/* Form */}
          <form onSubmit={handleTrack} style={{ background:'white', border:'1px solid var(--mid-grey)', borderRadius:'14px', padding:'28px 32px', marginBottom:'28px' }}>
            <div style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'22px', textTransform:'uppercase', marginBottom:'4px' }}>Track Order</div>
            <p style={{ fontSize:'13px', color:'var(--text-muted)', marginBottom:'20px' }}>Order number is on your confirmation email. Format: KBD-YYYY-NNNN</p>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr auto', gap:'12px', alignItems:'end' }}>
              <div>
                <label style={{ display:'block', fontSize:'11px', fontWeight:600, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--text-muted)', marginBottom:'6px' }}>Order Number</label>
                <input value={orderNum} onChange={e=>setOrderNum(e.target.value)} placeholder="KBD-2026-0512"
                  style={{ width:'100%', border:'1.5px solid var(--mid-grey)', borderRadius:'8px', padding:'12px 14px', fontSize:'14px', color:'var(--text-body)', background:'white', fontFamily:'DM Sans, sans-serif' }}/>
              </div>
              <div>
                <label style={{ display:'block', fontSize:'11px', fontWeight:600, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--text-muted)', marginBottom:'6px' }}>Email Address</label>
                <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@email.com"
                  style={{ width:'100%', border:'1.5px solid var(--mid-grey)', borderRadius:'8px', padding:'12px 14px', fontSize:'14px', color:'var(--text-body)', background:'white', fontFamily:'DM Sans, sans-serif' }}/>
              </div>
              <button type="submit" disabled={tracking} style={{ background:'var(--red)', color:'white', border:'none', borderRadius:'8px', padding:'12px 24px', fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'15px', textTransform:'uppercase', letterSpacing:'0.06em', cursor:tracking?'wait':'pointer', height:'46px', whiteSpace:'nowrap' }}>
                {tracking ? 'Looking…' : 'Track Order'}
              </button>
            </div>
            <div style={{ marginTop:'14px', fontSize:'12px', color:'var(--text-muted)' }}>
              Don't have your order number? <a href="#" style={{color:'var(--red)', textDecoration:'underline', fontWeight:600}}>Look it up by email</a>
            </div>
          </form>

          {showResult && (
            <div style={{ animation:'slideUp 0.4s ease', background:'white', border:'1px solid var(--mid-grey)', borderRadius:'14px', overflow:'hidden' }}>
              {/* Order summary header */}
              <div style={{ padding:'24px 32px', borderBottom:'1px solid var(--mid-grey)', display:'flex', alignItems:'center', justifyContent:'space-between', gap:'24px', flexWrap:'wrap' }}>
                <div>
                  <div style={{ fontSize:'11px', letterSpacing:'0.15em', textTransform:'uppercase', color:'var(--text-muted)', fontWeight:600, marginBottom:'4px' }}>Order Number</div>
                  <div style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'28px', letterSpacing:'0.04em', color:'var(--black)' }}>{SAMPLE_ORDER.number}</div>
                  <div style={{ fontSize:'13px', color:'var(--text-muted)', marginTop:'4px' }}>Placed {SAMPLE_ORDER.date} · Confirmation sent to {SAMPLE_ORDER.email}</div>
                </div>
                <div style={{ background:'rgba(204,0,0,0.08)', color:'var(--red)', padding:'6px 14px', borderRadius:'100px', fontSize:'11px', fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase' }}>
                  {STEPS[SAMPLE_ORDER.status].label}
                </div>
              </div>

              {/* Timeline */}
              <div style={{ padding:'32px' }}>
                <div style={{ display:'grid', gridTemplateColumns:'repeat(5, 1fr)', gap:'4px', marginBottom:'28px', position:'relative' }}>
                  {/* Connecting line */}
                  <div style={{ position:'absolute', top:'18px', left:'10%', right:'10%', height:'2px', background:'var(--mid-grey)' }}/>
                  <div style={{ position:'absolute', top:'18px', left:'10%', height:'2px', background:'var(--red)', width:`${(SAMPLE_ORDER.status / (STEPS.length - 1)) * 80}%`, transition:'width 0.8s ease' }}/>
                  {STEPS.map((s, i) => {
                    const done = i < SAMPLE_ORDER.status;
                    const current = i === SAMPLE_ORDER.status;
                    return (
                      <div key={s.label} style={{ textAlign:'center', position:'relative', zIndex:1 }}>
                        <div style={{
                          width:'36px', height:'36px', borderRadius:'50%',
                          background: done?'var(--red)':current?'var(--red)':'white',
                          border: current?'3px solid var(--red)':done?'none':'2px solid var(--mid-grey)',
                          color:done?'white':current?'white':'var(--mid-grey)',
                          margin:'0 auto 10px', display:'flex', alignItems:'center', justifyContent:'center',
                          fontWeight:700, fontSize:'13px',
                          boxShadow: current?'0 0 0 6px rgba(204,0,0,0.15)':'none',
                          transition:'all 0.3s'
                        }}>
                          {done ? (
                            <svg width="16" height="16" fill="none" stroke="white" strokeWidth="3" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
                          ) : current ? (
                            <span style={{width:'10px',height:'10px',borderRadius:'50%',background:'white',display:'block'}}/>
                          ) : (
                            i + 1
                          )}
                        </div>
                        <div style={{ fontSize:'12px', fontWeight: current?700:500, color: current?'var(--black)':done?'var(--text-body)':'var(--text-muted)', lineHeight:1.3 }}>{s.label}</div>
                        <div style={{ fontSize:'11px', color:'var(--text-muted)', marginTop:'2px' }}>{s.date}</div>
                      </div>
                    );
                  })}
                </div>

                {/* Current step detail */}
                <div style={{ background:'var(--cream)', borderLeft:'3px solid var(--red)', borderRadius:'0 10px 10px 0', padding:'18px 22px' }}>
                  <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:'16px', flexWrap:'wrap' }}>
                    <div>
                      <div style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'20px', textTransform:'uppercase', color:'var(--black)', marginBottom:'4px' }}>
                        Currently: {STEPS[SAMPLE_ORDER.status].label}
                      </div>
                      <div style={{ fontSize:'14px', color:'var(--text-body)', lineHeight:1.6 }}>{STEPS[SAMPLE_ORDER.status].desc}</div>
                    </div>
                    <div style={{ textAlign:'right' }}>
                      <div style={{ fontSize:'11px', color:'var(--text-muted)', letterSpacing:'0.1em', textTransform:'uppercase', fontWeight:600 }}>Estimated Delivery</div>
                      <div style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'22px', color:'var(--black)' }}>{SAMPLE_ORDER.eta}</div>
                    </div>
                  </div>
                </div>

                {/* Item + shipping detail grid */}
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'16px', marginTop:'24px' }}>
                  <div style={{ border:'1px solid var(--mid-grey)', borderRadius:'10px', padding:'18px 20px' }}>
                    <div style={{ fontSize:'11px', letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--text-muted)', fontWeight:600, marginBottom:'10px' }}>Item</div>
                    <div style={{ fontWeight:700, fontSize:'15px', color:'var(--black)', marginBottom:'4px' }}>{SAMPLE_ORDER.item.name}</div>
                    <div style={{ fontSize:'13px', color:'var(--text-muted)' }}>{SAMPLE_ORDER.item.vehicle}</div>
                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginTop:'12px' }}>
                      <span style={{ fontSize:'12px', color:'var(--text-muted)' }}>Qty {SAMPLE_ORDER.item.qty}</span>
                      <span style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:800, fontSize:'22px' }}>${SAMPLE_ORDER.item.price}</span>
                    </div>
                  </div>
                  <div style={{ border:'1px solid var(--mid-grey)', borderRadius:'10px', padding:'18px 20px' }}>
                    <div style={{ fontSize:'11px', letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--text-muted)', fontWeight:600, marginBottom:'10px' }}>Shipping</div>
                    <div style={{ fontWeight:700, fontSize:'15px', color:'var(--black)', marginBottom:'4px' }}>{SAMPLE_ORDER.carrier}</div>
                    <div style={{ fontFamily:'ui-monospace, monospace', fontSize:'12px', color:'var(--text-muted)' }}>Tracking: {SAMPLE_ORDER.tracking}</div>
                    <a href="#" style={{ marginTop:'12px', display:'inline-flex', alignItems:'center', gap:'4px', fontSize:'13px', color:'var(--red)', fontWeight:600, textDecoration:'none' }}>
                      View on carrier site
                      <svg width="11" height="11" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></svg>
                    </a>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>

        {/* Sidebar */}
        <aside>
          <div style={{ background:'var(--black)', borderRadius:'12px', padding:'24px', color:'white' }}>
            <div style={{ fontSize:'11px', letterSpacing:'0.15em', textTransform:'uppercase', color:'var(--red)', fontWeight:700, marginBottom:'10px' }}>Need Help?</div>
            <div style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'22px', textTransform:'uppercase', lineHeight:1.05, marginBottom:'12px' }}>Talk to our team in Fullerton</div>
            <p style={{ fontSize:'13px', color:'rgba(255,255,255,0.55)', lineHeight:1.7, marginBottom:'16px' }}>
              Polyurethane kits ship folded. If yours just arrived and you have questions about unfolding, install, or fit — call us. We'd rather walk you through it than have you guess.
            </p>
            <a href="tel:18773993794" style={{ display:'block', fontFamily:'Barlow Condensed, sans-serif', fontWeight:800, fontSize:'24px', color:'white', textDecoration:'none', letterSpacing:'0.04em', marginBottom:'4px' }}>
              (877) 399-3794
            </a>
            <div style={{ fontSize:'11px', color:'rgba(255,255,255,0.4)', letterSpacing:'0.06em' }}>Mon–Fri · 9am–5pm PT</div>
            <a href="#" style={{ display:'block', marginTop:'18px', background:'var(--red)', color:'white', padding:'10px', borderRadius:'8px', textDecoration:'none', fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'14px', textTransform:'uppercase', letterSpacing:'0.06em', textAlign:'center' }}>
              Contact Form
            </a>
          </div>

          <div style={{ marginTop:'16px', background:'white', border:'1px solid var(--mid-grey)', borderRadius:'12px', padding:'20px 22px' }}>
            <div style={{ fontSize:'11px', letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--text-muted)', fontWeight:600, marginBottom:'10px' }}>Quick Links</div>
            {[['Unfolding Guide','#'],['Paint Prep Guide','#'],['Returns Policy','#'],['File A Warranty Claim','#']].map(([l,h]) => (
              <a key={l} href={h} style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'10px 0', borderBottom:'1px solid var(--mid-grey)', color:'var(--text-body)', textDecoration:'none', fontSize:'13px', fontWeight:500 }}>
                {l}
                <svg width="12" height="12" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
              </a>
            ))}
          </div>
        </aside>
      </div>

      <Footer/>
    </div>
  );
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"accentColor":"#CC0000"}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => {
    document.documentElement.style.setProperty('--red', tweaks.accentColor);
  }, [tweaks.accentColor]);
  return (
    <div>
      <TweaksPanel title="Tweaks">
        <TweakSection label="Brand"><TweakColor label="Accent" value={tweaks.accentColor} onChange={v=>setTweak('accentColor',v)}/></TweakSection>
      </TweaksPanel>
      <OrderStatusPage/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
(function(){
  var mql = window.matchMedia("(max-width: 640px)");

  function applyMobile() {
    var isMobile = mql.matches;

    // Nav: hamburger + desktop-only
    var links = document.querySelector(".nav-links");
    if (links) links.style.display = isMobile ? "none" : "flex";
    var hamburger = document.querySelector(".nav-hamburger");
    if (hamburger) hamburger.style.display = isMobile ? "flex" : "none";
    document.querySelectorAll(".nav-desktop-only").forEach(function(el) {
      el.style.display = isMobile ? "none" : "";
    });

    // Collapse main layout (1fr 320px → 1fr)
    var mainGrid = document.querySelector('[style*="1fr 320px"]');
    if (mainGrid) mainGrid.style.gridTemplateColumns = isMobile ? "1fr" : "1fr 320px";

    // Collapse form row (1fr 1fr auto → 1fr)
    var formRow = document.querySelector('[style*="1fr 1fr auto"]');
    if (formRow) formRow.style.gridTemplateColumns = isMobile ? "1fr" : "1fr 1fr auto";

    // Collapse footer columns (1.6fr 1fr 1fr 1fr → 1fr)
    var footerGrid = document.querySelector('[style*="1.6fr 1fr 1fr 1fr"]');
    if (footerGrid) footerGrid.style.gridTemplateColumns = isMobile ? "1fr" : "1.6fr 1fr 1fr 1fr";
  }

  applyMobile();
  mql.addEventListener("change", applyMobile);
  var observer = new MutationObserver(applyMobile);
  observer.observe(document.body || document.documentElement, { childList: true, subtree: true });
})();
</script>
</body>
</html>
