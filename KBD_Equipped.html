<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --red: #CC0000; --black: #0C0C0C; --off-white: #F7F6F4; --mid-grey: #E8E6E2; --text-muted: #7A7570; --text-body: #2A2825; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--off-white); }

  @keyframes scaleIn { from { opacity:0; transform:scale(0.96); } to { opacity:1; transform:scale(1); } }

  /* Batch 6 — responsive + a11y */

  /* Nav hamburger + dropdown (placed before @media blocks to avoid parse issues) */
    nav > div { padding: 0 12px !important; gap: 8px !important; }

  .nav-hamburger { display: none; }

    letter-spacing: 0.04em; border-bottom: 1px solid #1a1a1a;
    transition: color 0.15s;
  }
  .nav-dropdown a:hover, .nav-dropdown a:active { color: white; background: #111; }


  /* Mobile responsive rules (placed before @media blocks to avoid CSS parse issues) */
  @media (max-width: 900px) {
    [style*="repeat(4,"] { grid-template-columns: 1fr !important; }
    [style*="repeat(5,"] { grid-template-columns: 1fr !important; }
    [style*="repeat(3,"] { grid-template-columns: 1fr !important; }
    [style*="1fr 1fr"], [style*="1.8fr"] { grid-template-columns: 1fr !important; }
    h2[style*="nowrap"] { white-space: normal !important; }
    [style*="position: sticky"] { position: static !important; }
    nav > div { padding: 0 16px !important; gap: 12px !important; }
    section, main, footer > div, .kbd-page { padding-left: 16px !important; padding-right: 16px !important; }
  }
  @media (max-width: 640px) {
    nav { overflow-x: hidden; }
    nav > div { flex-wrap: nowrap; }
    nav > div { padding: 0 12px !important; gap: 8px !important; }
    section, main, footer > div { padding-left: 16px !important; padding-right: 16px !important; }
  }

  @media (max-width: 900px) {
    /* Generic 3-column → 1-column collapse for product / build / blog grids */
    [style*="grid-template-columns: repeat(4,"], [style*="grid-template-columns:repeat(4,"],
    [style*="grid-template-columns: repeat(4,"], [style*="grid-template-columns:repeat(4,"],
    [style*="gridTemplateColumns: repeat(4", [style*="gridTemplateColumns:repeat(4"], [style*="gridTemplateColumns: repeat(3"], [style*="gridTemplateColumns:repeat(4"], [style*="gridTemplateColumns:repeat(4"], [style*="gridTemplateColumns:repeat(4"], [style*="gridTemplateColumns:repeat(3"] {
      grid-template-columns: 1fr !important;
    }
    /* Two-column layouts collapse to one */
    [style*="grid-template-columns: 1fr 1fr"], [style*="grid-template-columns:1fr 1fr"] {
      grid-template-columns: 1fr !important;
    }
    /* Release fixed row height so cards size naturally on mobile */
    [style*="gridAutoRows: 220px"] { grid-auto-rows: auto !important; }
    /* Drop the sticky sidebar position on small screens */
    [style*="position: sticky"], [style*="position:sticky"] {
      position: static !important;
    }
    /* Reduce nav padding on small screens */
    nav > div { padding: 0 16px !important; gap: 12px !important; }
    /* Page-level padding tighten */
    section, main, footer > div, .kbd-page { padding-left: 16px !important; padding-right: 16px !important; }
  }
    nav > div { padding: 0 12px !important; gap: 8px !important; }
    /* Page-level padding tighten */
    section, main, footer > div { padding-left: 16px !important; padding-right: 16px !important; }
  }

  /* Hamburger — hidden by default, shown on mobile */
  .nav-hamburger { display: none; }
  /* Dropdown panel */
  .nav-dropdown a {
    display: block; padding: 14px 24px; color: #ccc;
    font-size: 14px; font-weight: 500; text-decoration: none;

  /* 6.4 Focus-visible — visible keyboard focus, not on click */
  *:focus { outline: none; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
  textarea:focus-visible, [role="button"]:focus-visible {

    outline-offset: 2px;

  }

  input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline-color: var(--black);
  }

  /* 6.3 — Ensure body text on dark surfaces is at least rgba(255,255,255,0.7) */
  /* (handled per-element where critical; this is informational)*/

</style>

// ── NAV ────────────────────────────────────────────────────────────────────
function Nav() {
  const cartCount = (() => { try { return JSON.parse(localStorage.getItem('kbd_cart')||'[]').reduce((s,i)=>s+i.qty,0); } catch { return 0; } })();
  const [menuOpen, setMenuOpen] = useState(false);

  useEffect(() => {
    function handleClick(e) {
      const dropdown = document.querySelector('.nav-dropdown');
      const hamburger = document.querySelector('.nav-hamburger');
      if ((!dropdown || !dropdown.contains(e.target)) && (!hamburger || !hamburger.contains(e.target))) {
        setMenuOpen(false);
      }
    }
    document.addEventListener('click', handleClick);
    document.addEventListener('touchstart', handleClick);
    return () => {
      document.removeEventListener('click', handleClick);
      document.removeEventListener('touchstart', handleClick);
    };
  }, []);
  return (
    <nav style={{ position:'sticky', top:0, zIndex:1000, background:'var(--black)', borderBottom:'1px solid #222' }}>
      <div style={{ maxWidth:'1440px', margin:'0 auto', display:'flex', alignItems:'center', padding:'0 40px', height:'64px', gap:'24px' }}>
        <a href="KBD_Homepage.html" style={{display:'flex',alignItems:'center',height:'40px',textDecoration:'none',flexShrink:0}} aria-label="KBD Body Kits home">

              borderBottom: label==='KBD Equipped' ? '2px solid var(--red)' : '2px solid transparent'

            onMouseEnter={e=>e.currentTarget.style.color='white'}
            onMouseLeave={e=>{if(label!=='KBD Equipped') e.currentTarget.style.color='#aaa';}}
            >{label}</a>

        <a href="KBD_Equipped.html#submit" style={{

            <line x1="3" y1="6" x2="21" y2="6" /><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="18" x2="21" y2="18" />
          </svg>

        <button onClick={()=>window.location.href='KBD_Checkout.html'} style={{ background:'var(--red)', border:'none', cursor:'pointer', color:'white', padding:'8px 18px', borderRadius:'6px', fontWeight:600, fontSize:'13px', display:'flex', alignItems:'center', gap:'6px', fontFamily:'DM Sans, sans-serif' }}>

// ── LIGHTBOX ───────────────────────────────────────────────────────────────
function Lightbox({ build, onClose }) {
  const [activePhoto, setActivePhoto] = useState(0);
  const [imgErr, setImgErr] = useState({});

  useEffect(() => {
    const onKey = e => { if(e.key==='Escape') onClose(); if(e.key==='ArrowRight') setActivePhoto(p=>(p+1)%build.photos.length); if(e.key==='ArrowLeft') setActivePhoto(p=>(p-1+build.photos.length)%build.photos.length); };
    document.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  }, [build, onClose]);

  return (
    <div onClick={onClose} style={{
      position:'fixed', inset:0, background:'rgba(0,0,0,0.92)', zIndex:9999,
      display:'flex', alignItems:'center', justifyContent:'center',
      animation:'fadeIn 0.2s ease', padding:'24px'
    }}>
      <div onClick={e=>e.stopPropagation()} style={{
        background:'var(--black)', borderRadius:'20px', overflow:'hidden',
        width:'100%', maxWidth:'1100px', maxHeight:'92vh', display:'flex', flexDirection:'column',
        animation:'scaleIn 0.25s ease', border:'1px solid #2a2a2a'
      }}>
        {/* Header */}
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'20px 28px', borderBottom:'1px solid #1e1e1e', flexShrink:0 }}>
          <div>
            <div style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'24px', color:'white', textTransform:'uppercase', lineHeight:1 }}>{build.car}</div>
            <div style={{ color:'#666', fontSize:'13px', marginTop:'4px' }}>Build by <IGHandle handle={build.owner} color="rgba(255,255,255,0.7)" size="13px"/> · {build.location} · {build.date}</div>
          </div>
          <button aria-label="Close" onClick={onClose} style={{ background:'rgba(255,255,255,0.08)', border:'none', borderRadius:'8px', color:'#888', width:'36px', height:'36px', cursor:'pointer', fontSize:'18px', display:'flex', alignItems:'center', justifyContent:'center' }}>×</button>
        </div>

        {/* Scrollable body */}
        <div style={{ overflowY:'auto', flex:1 }}>
          {/* Main image */}
          <div style={{ position:'relative', background:'#111', aspectRatio:'16/9' }}>
            {!imgErr[activePhoto] ? (
              <img src={U(build.photos[activePhoto], 1200)} alt={build.car}
                onError={()=>setImgErr(e=>({...e,[activePhoto]:true}))}
                style={{ width:'100%', height:'100%', objectFit:'cover', display:'block' }}/>
            ) : (
              <div style={{ width:'100%', height:'100%', display:'flex', alignItems:'center', justifyContent:'center', color:'#444', fontSize:'13px' }}>Photo unavailable</div>
            )}
            {/* Nav arrows */}
            {build.photos.length > 1 && (
              <>
                <button aria-label="Previous photo" onClick={()=>setActivePhoto(p=>(p-1+build.photos.length)%build.photos.length)} style={{ position:'absolute', left:'16px', top:'50%', transform:'translateY(-50%)', background:'rgba(0,0,0,0.6)', border:'none', borderRadius:'50%', width:'44px', height:'44px', cursor:'pointer', color:'white', fontSize:'20px', display:'flex', alignItems:'center', justifyContent:'center', backdropFilter:'blur(4px)' }}>‹</button>
                <button aria-label="Next photo" onClick={()=>setActivePhoto(p=>(p+1)%build.photos.length)} style={{ position:'absolute', right:'16px', top:'50%', transform:'translateY(-50%)', background:'rgba(0,0,0,0.6)', border:'none', borderRadius:'50%', width:'44px', height:'44px', cursor:'pointer', color:'white', fontSize:'20px', display:'flex', alignItems:'center', justifyContent:'center', backdropFilter:'blur(4px)' }}>›</button>
                <div style={{ position:'absolute', bottom:'16px', left:'50%', transform:'translateX(-50%)', display:'flex', gap:'6px' }}>
                  {build.photos.map((_,i) => (

              <div key={i} onClick={()=>setActivePhoto(i)} style={{

              }}>

            </p>
          </div>

          {/* Parts used */}
          <div style={{ padding:'24px 28px' }}>

            <div style={{ display:'grid', gridTemplateColumns:`repeat(${Math.min(build.parts.length,3)}, 1fr)`, gap:'12px', marginBottom:'18px' }}>
              {build.parts.map((part, i) => (
                <a key={i} href={`KBD_Product.html?id=${part.id}`} style={{ textDecoration:'none', display:'flex', alignItems:'center', gap:'12px', padding:'14px 16px', background:'rgba(255,255,255,0.04)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:'10px', transition:'all 0.15s', cursor:'pointer' }}

                  onMouseLeave={e=>{e.currentTarget.style.borderColor='rgba(255,255,255,0.08)';e.currentTarget.style.background='rgba(255,255,255,0.04)';}}>

                  </div>

                    <div style={{ color:'#555', fontSize:'11px', marginTop:'2px' }}>{part.cat}</div>
                  </div>
                  <div style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:800, fontSize:'18px', color:'white', flexShrink:0 }}>${part.price}</div>
                </a>
              ))}
            </div>
            <BuildCartCTA build={build}/>
          </div>
        </div>
      </div>
    </div>
  );
}

function BuildCartCTA({ build }) {
  const [adding, setAdding] = React.useState(false);
  const [added, setAdded] = React.useState(false);
  const total = build.parts.reduce((s,p)=>s+p.price, 0);

  function addAll() {
    if (adding || added) return;
    setAdding(true);
    try {
      const cart = JSON.parse(localStorage.getItem('kbd_cart') || '[]');
      build.parts.forEach(p => {
        const existing = cart.find(i => i.id === p.id);
        if (existing) existing.qty = (existing.qty||1) + 1;
        else cart.push({ id:p.id, name:p.name, vehicle:build.car, price:p.price, qty:1, cat:p.cat, img:build.cover });
      });
      localStorage.setItem('kbd_cart', JSON.stringify(cart));
      setAdded(true);
      setTimeout(()=>{ setAdded(false); setAdding(false); }, 2400);
    } catch(e){ setAdding(false); }
  }

  return (
    <button onClick={addAll} style={{
      width:'100%', marginTop:'4px', display:'flex', alignItems:'center', justifyContent:'center', gap:'10px',
      background: added ? '#2d8a50' : 'var(--red)', color:'white', border:'none',
      borderRadius:'10px', padding:'14px', fontFamily:'Barlow Condensed, sans-serif',
      fontWeight:900, fontSize:'16px', letterSpacing:'0.06em', textTransform:'uppercase', cursor:'pointer',
      transition:'background 0.2s'
    }}>
      {added ? (
        <>
          <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
          Build added — keep shopping
        </>
      ) : (
        <>
          <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          Add Full Build to Cart — ${total.toLocaleString()}
        </>
      )}
    </button>
  );
}

// ── BUILD CARD ─────────────────────────────────────────────────────────────

          display:'flex', alignItems:'center', gap:'5px'
        }}>

      </div>

      {/* Parts count badge */}

        position:'absolute', top:'14px', right:'14px',
        background:'rgba(0,0,0,0.7)', backdropFilter:'blur(8px)',

        padding:'4px 10px', fontSize:'11px', color:'rgba(255,255,255,0.7)',
        fontWeight:600, display:'flex', alignItems:'center', gap:'5px'
      }}>
        <svg width="10" height="10" fill="none" stroke="var(--red)" strokeWidth="2" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>

// ── SUBMIT FORM ────────────────────────────────────────────────────────────
function SubmitBuild() {
  const [submitted, setSubmitted] = useState(false);
  const [form, setForm] = useState({ name:'', car:'', instagram:'', email:'', caption:'' });
  const update = (k,v) => setForm(f=>({...f,[k]:v}));
  const isValid = form.name && form.car && form.email;

  if (submitted) {
    return (
      <div style={{ textAlign:'center', padding:'48px 0' }}>
        <div style={{ width:'64px', height:'64px', borderRadius:'50%', background:'rgba(204,0,0,0.12)', border:'2px solid var(--red)', display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 20px' }}>
          <svg width="28" height="28" fill="none" stroke="var(--red)" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <h3 style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'28px', textTransform:'uppercase', color:'white', marginBottom:'8px' }}>Build Submitted!</h3>
        <p style={{ color:'#666', fontSize:'14px' }}>We'll review and feature it in the KBD Equipped gallery. Stay tuned!</p>
      </div>
    );
  }

  return (
    <div>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px', marginBottom:'12px' }}>
        {[['name','Your Name (or @handle)','@your_handle'],['car','Vehicle (Year Make Model)','1995 Nissan 240SX S14 Zenki'],['instagram','Instagram Handle','@yourhandle'],['email','Email Address','you@email.com']].map(([key,label,ph])=>(
          <div key={key}>
            <label style={{ display:'block', fontSize:'10px', fontWeight:600, letterSpacing:'0.15em', textTransform:'uppercase', color:'#666', marginBottom:'6px' }}>{label}</label>
            <input value={form[key]} onChange={e=>update(key,e.target.value)} placeholder={ph}
              style={{ width:'100%', background:'rgba(255,255,255,0.06)', border:'1.5px solid rgba(255,255,255,0.1)', borderRadius:'8px', padding:'11px 14px', fontSize:'14px', color:'white', fontFamily:'DM Sans, sans-serif', outline:'none', transition:'border-color 0.15s' }}
              onFocus={e=>e.target.style.borderColor='rgba(255,255,255,0.3)'}
              onBlur={e=>e.target.style.borderColor='rgba(255,255,255,0.1)'}/>
          </div>
        ))}
      </div>
      <div style={{ marginBottom:'16px' }}>
        <label style={{ display:'block', fontSize:'10px', fontWeight:600, letterSpacing:'0.15em', textTransform:'uppercase', color:'#666', marginBottom:'6px' }}>Tell Us About Your Build</label>
        <textarea value={form.caption} onChange={e=>update('caption',e.target.value)} placeholder="What KBD parts did you use? How was the install? Any tips for others?" rows={3}
          style={{ width:'100%', background:'rgba(255,255,255,0.06)', border:'1.5px solid rgba(255,255,255,0.1)', borderRadius:'8px', padding:'11px 14px', fontSize:'14px', color:'white', fontFamily:'DM Sans, sans-serif', resize:'vertical', outline:'none', lineHeight:1.6 }}
          onFocus={e=>e.target.style.borderColor='rgba(255,255,255,0.3)'}
          onBlur={e=>e.target.style.borderColor='rgba(255,255,255,0.1)'}/>
      </div>
      <button onClick={()=>isValid&&setSubmitted(true)} style={{
        background: isValid?'var(--red)':'rgba(255,255,255,0.08)',
        color: isValid?'white':'rgba(255,255,255,0.3)',
        border:'none', borderRadius:'10px', padding:'14px 28px',
        fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'16px',
        letterSpacing:'0.06em', textTransform:'uppercase', cursor:isValid?'pointer':'default',
        display:'flex', alignItems:'center', gap:'8px'
      }}>
        Submit My Build
        <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  );
}

// ── FILTER BAR ─────────────────────────────────────────────────────────────
function FilterBar({ active, setActive }) {
  const filters = ['All','Nissan','BMW','Lexus','Mazda','Jeep','Ford','Toyota','Subaru','Chevrolet'];
  return (
    <div style={{ display:'flex', gap:'6px', flexWrap:'wrap' }}>
      {filters.map(f => (
        <button key={f} onClick={()=>setActive(f)} style={{
          background: active===f?'var(--black)':'white',
          color: active===f?'white':'var(--text-muted)',
          border:`1.5px solid ${active===f?'var(--black)':'var(--mid-grey)'}`,
          borderRadius:'100px', padding:'7px 16px', fontSize:'13px', fontWeight:active===f?600:400,
          cursor:'pointer', transition:'all 0.15s', fontFamily:'DM Sans, sans-serif'
        }}>{f}</button>
      ))}
    </div>
  );
}

// ── MAIN APP ───────────────────────────────────────────────────────────────

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"accentColor":"#CC0000"}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [activeBuild, setActiveBuild] = useState(null);
  const [filter, setFilter] = useState('All');

  // Auto-open build from URL hash
  React.useEffect(() => {
    const hash = window.location.hash.replace('#','');
    const params = new URLSearchParams(hash);
    const buildId = parseInt(params.get('build'));
    if (buildId) {
      const build = BUILDS.find(b => b.id === buildId);
      if (build) setTimeout(() => setActiveBuild(build), 200);
    }
  }, []);

  React.useEffect(() => {
    document.documentElement.style.setProperty('--red', tweaks.accentColor);
  }, [tweaks.accentColor]);

  const filtered = filter==='All' ? BUILDS : BUILDS.filter(b => b.car.includes(filter));

  return (
    <div>
      <TweaksPanel title="Tweaks">
        <TweakSection label="Brand">
          <TweakColor label="Accent" value={tweaks.accentColor} onChange={v=>setTweak('accentColor',v)}/>
        </TweakSection>
      </TweaksPanel>
      <div style={{ background:'var(--red)', color:'white', textAlign:'center', padding:'9px 16px', fontSize:'12px', fontWeight:600, letterSpacing:'0.12em', textTransform:'uppercase', fontFamily:'Barlow Condensed, sans-serif' }}>Made in USA — Orange County, CA for almost 50 years</div>
      <Nav/>

      {/* Hero */}
      <div style={{
        background:'var(--black)', padding:'72px 40px 64px',
        position:'relative', overflow:'hidden', borderBottom:'1px solid #1a1a1a'
      }}>
        <div style={{ position:'absolute', inset:0, backgroundImage:`url('${KBD_BASE}/nissan-240sx-s14-zenki-by-rob-nappyboyautomotive-1.jpg')`, backgroundSize:'cover', backgroundPosition:'center', opacity:0.22 }}/>
        <div style={{ position:'absolute', inset:0, background:'linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.45) 50%, rgba(0,0,0,0.65) 100%)', pointerEvents:'none' }}/>
        <div style={{ maxWidth:'1440px', margin:'0 auto', position:'relative' }}>
          <div style={{ fontSize:'11px', letterSpacing:'0.2em', textTransform:'uppercase', color:'var(--red)', fontWeight:700, marginBottom:'16px' }}>Community Gallery</div>
          <h1 style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'clamp(48px,7vw,88px)', color:'white', textTransform:'uppercase', lineHeight:0.9, marginBottom:'16px' }}>
            KBD<br/><span style={{color:'var(--red)'}}>Equipped</span>
          </h1>
          <p style={{ color:'rgba(255,255,255,0.4)', fontSize:'16px', maxWidth:'480px', lineHeight:1.7 }}>

          </p>
          <div style={{ display:'flex', gap:'32px', marginTop:'28px' }}>
            {(() => {
              const uniqueParts = new Set();
              BUILDS.forEach(b => b.parts.forEach(p => uniqueParts.add(p.id)));
              const latest = BUILDS[0]?.date || '—';
              return [[String(BUILDS.length),'Builds Featured'],[String(uniqueParts.size),'KBD Parts Tagged'],[latest,'Latest Entry']];
            })().map(([n,l])=>(
              <div key={l}>
                <div style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'32px', color:'white', lineHeight:1 }}>{n}</div>
                <div style={{ color:'#666', fontSize:'12px', letterSpacing:'0.06em', textTransform:'uppercase' }}>{l}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Filters + grid */}
      <div style={{ maxWidth:'1440px', margin:'0 auto', padding:'40px 40px 80px' }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'28px', flexWrap:'wrap', gap:'16px' }}>
          <FilterBar active={filter} setActive={setFilter}/>
          <div style={{ color:'var(--text-muted)', fontSize:'13px' }}>{filtered.length} build{filtered.length!==1?'s':''}</div>
        </div>

        {/* Masonry-style grid */}
        <div style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gridAutoRows:'220px', gap:'16px' }}>
          {filtered.map(build => (
            <BuildCard key={build.id} build={build} onClick={() => setActiveBuild(build)}/>
          ))}
        </div>
      </div>

      {/* Submit section */}
      <div id="submit" style={{ background:'var(--black)', padding:'80px 40px', borderTop:'1px solid #1a1a1a' }}>
        <div style={{ maxWidth:'1440px', margin:'0 auto', display:'grid', gridTemplateColumns:'1fr 1fr', gap:'80px', alignItems:'center' }}>
          <div>
            <div style={{ fontSize:'11px', letterSpacing:'0.2em', textTransform:'uppercase', color:'var(--red)', fontWeight:700, marginBottom:'16px' }}>Share Your Build</div>
            <h2 style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'clamp(36px,4vw,60px)', color:'white', textTransform:'uppercase', lineHeight:0.9, marginBottom:'20px' }}>
              Running<br/>KBD Parts?<br/><span style={{color:'var(--red)',fontStyle:'italic'}}>Show It Off.</span>
            </h2>
            <p style={{ color:'rgba(255,255,255,0.4)', fontSize:'15px', lineHeight:1.75, maxWidth:'360px' }}>

      </div>

      {/* Lightbox */}
      {activeBuild && <Lightbox build={activeBuild} onClose={() => setActiveBuild(null)}/>}

      <footer style={{ background:'var(--black)', color:'rgba(255,255,255,0.5)', padding:'32px 40px', textAlign:'center', display:'flex', justifyContent:'center', alignItems:'center', gap:'12px', flexWrap:'wrap', borderTop:'1px solid #1a1a1a' }}>
        <img src="assets/kbd-logo.png" alt="KBD Body Kits" style={{height:'112px',width:'auto',display:'block'}}/>
        <span style={{fontSize:'12px',color:'#555'}}>Manufactured in Fullerton, CA</span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
(function(){
  var mql = window.matchMedia("(max-width: 640px)");
  function hideNav() {
    var links = document.querySelector(".nav-links");
    if (links) links.style.display = mql.matches ? "none" : "flex";
  }
  hideNav();
  mql.addEventListener("change", hideNav);
  var observer = new MutationObserver(function(){
    var links = document.querySelector(".nav-links");
    if (links && links.style.display !== "none" && mql.matches) links.style.display = "none";
  });
  observer.observe(document.body || document.documentElement, { childList: true, subtree: true });
})();
</script>
<script>
(function(){
  var mql = window.matchMedia("(max-width: 640px)");
  function applyMobileNav() {
    var isMobile = mql.matches;
    var links = document.querySelector(".nav-links");
    if (links) links.style.display = isMobile ? "none" : "flex";
    var hamburger = document.querySelector(".nav-hamburger");
    if (hamburger) hamburger.style.display = isMobile ? "flex" : "none";
    document.querySelectorAll(".nav-desktop-only").forEach(function(el) {
      el.style.display = isMobile ? "none" : "";
    });
  }
  applyMobileNav();
  mql.addEventListener("change", applyMobileNav);
  new MutationObserver(applyMobileNav).observe(document.body || document.documentElement, { childList: true, subtree: true });
})();
</script>
