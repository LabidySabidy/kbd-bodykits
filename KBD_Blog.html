<script type="text/babel">
const { useState } = React;

const B = 'https://kbdbodykits.com/images/productimages';
const POSTS = [
  { id:'paint-prep-5-steps', title:'How to Paint Prep Polyurethane in 5 Steps', category:'How-To', date:'May 12, 2026', readTime:'6 min read',

function CategoryPill({ label }) {
  return <span style={{ display:'inline-block', background:'rgba(204,0,0,0.08)', color:'var(--red)', padding:'4px 10px', borderRadius:'4px', fontSize:'10px', fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase' }}>{label}</span>;
}

function PostThumb({ post, height='100%' }) {
  if (post.photoId) {
    return (
      <div style={{ width:'100%', height, background:'#1a1a1a', overflow:'hidden' }}>
        <img src={post.photoId} alt={post.title} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>
      </div>
    );
  }
  return (
    <div style={{ width:'100%', height, background:'#1A1A1A', display:'flex', alignItems:'flex-end', padding:'10px 12px' }}>
      <span style={{ fontFamily:'ui-monospace, monospace', fontSize:'9px', letterSpacing:'0.08em', color:'rgba(255,255,255,0.35)', textTransform:'uppercase', lineHeight:1.3 }}>
        <span style={{color:'var(--red)',fontWeight:700}}>placeholder</span> — real photo: {post.title}
      </span>
    </div>
  );
}

function BlogIndex({ onOpen }) {
  const [activeCategory, setActiveCategory] = useState('All');
  const categories = ['All','How-To','Build Guides','Material Science','Builds','News'];
  const filtered = activeCategory === 'All' ? POSTS : POSTS.filter(p => p.category === activeCategory);
  const featured = POSTS.find(p => p.featured);
  const rest = filtered.filter(p => !p.featured || activeCategory !== 'All');

  return (
    <div>
      <section style={{ background:'var(--black)', padding:'72px 40px 56px', position:'relative', overflow:'hidden' }}>
        <div style={{ position:'absolute', inset:0, background:'linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(12,12,12,0.95) 100%)', pointerEvents:'none' }}/>
        <div style={{ maxWidth:'1200px', margin:'0 auto', position:'relative' }}>
          <div style={{ display:'inline-flex', alignItems:'center', gap:'12px', marginBottom:'20px' }}>
            <span style={{ width:'14px', height:'4px', background:'var(--red)' }}/>
            <span style={{ color:'rgba(255,255,255,0.7)', fontSize:'11px', letterSpacing:'0.22em', textTransform:'uppercase', fontWeight:700 }}>The Paddock — KBD Blog</span>
          </div>
          <h1 style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'clamp(48px,7vw,96px)', color:'white', textTransform:'uppercase', lineHeight:0.9, marginBottom:'14px' }}>

          </h1>
          <p style={{ color:'rgba(255,255,255,0.55)', fontSize:'16px', lineHeight:1.75, maxWidth:'620px' }}>
            How-to guides, build features, material deep dives, and the occasional FD sponsorship announcement. Written by the people who actually pull the molds.
          </p>
        </div>
      </section>

      {activeCategory === 'All' && featured && (
        <section style={{ background:'var(--cream)', padding:'64px 40px 32px' }}>
          <div style={{ maxWidth:'1200px', margin:'0 auto' }}>
            <div onClick={()=>onOpen(featured)} style={{ cursor:'pointer', display:'grid', gridTemplateColumns:'1.4fr 1fr', gap:'40px', alignItems:'stretch', background:'white', border:'1px solid var(--mid-grey)', borderRadius:'16px', overflow:'hidden', transition:'box-shadow 0.2s' }}
              onMouseEnter={e=>e.currentTarget.style.boxShadow='0 16px 48px rgba(0,0,0,0.1)'}
              onMouseLeave={e=>e.currentTarget.style.boxShadow='none'}>
              <PostThumb post={featured} height="380px"/>
              <div style={{ padding:'40px 36px', display:'flex', flexDirection:'column', justifyContent:'center' }}>
                <div style={{ display:'flex', alignItems:'center', gap:'10px', marginBottom:'16px' }}>
                  <CategoryPill label={featured.category}/>
                  <span style={{ fontSize:'11px', fontWeight:700, letterSpacing:'0.15em', textTransform:'uppercase', color:'var(--red)' }}>● Featured</span>
                </div>
                <h2 style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'clamp(28px,3vw,42px)', textTransform:'uppercase', color:'var(--black)', lineHeight:1, marginBottom:'18px' }}>{featured.title}</h2>
                <p style={{ fontSize:'15px', color:'var(--text-body)', lineHeight:1.75, marginBottom:'20px' }}>{featured.excerpt}</p>
                <div style={{ display:'flex', alignItems:'center', gap:'12px', color:'var(--text-muted)', fontSize:'13px' }}>
                  <span>{featured.author}</span><span>·</span><span>{featured.date}</span><span>·</span><span>{featured.readTime}</span>
                </div>
              </div>
            </div>
          </div>
        </section>
      )}

      <section style={{ background:'var(--cream)', padding:'32px 40px 96px' }}>
        <div style={{ maxWidth:'1200px', margin:'0 auto' }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'28px', flexWrap:'wrap', gap:'16px' }}>
            <div style={{ display:'flex', gap:'6px', flexWrap:'wrap' }}>
              {categories.map(c => (
                <button key={c} onClick={()=>setActiveCategory(c)} style={{
                  background: activeCategory===c?'var(--black)':'white',
                  color: activeCategory===c?'white':'var(--text-muted)',
                  border:`1.5px solid ${activeCategory===c?'var(--black)':'var(--mid-grey)'}`,
                  borderRadius:'100px', padding:'7px 16px', fontSize:'13px', fontWeight: activeCategory===c?600:400,
                  cursor:'pointer', fontFamily:'DM Sans, sans-serif'
                }}>{c}</button>
              ))}
            </div>
            <div style={{ color:'var(--text-muted)', fontSize:'13px' }}>{rest.length} post{rest.length!==1?'s':''}</div>
          </div>

          <div style={{ display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:'24px' }}>
            {rest.map(p => (
              <article key={p.id} onClick={()=>onOpen(p)} style={{ background:'white', border:'1px solid var(--mid-grey)', borderRadius:'12px', overflow:'hidden', cursor:'pointer', transition:'transform 0.2s, box-shadow 0.2s', display:'flex', flexDirection:'column' }}
                onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-3px)';e.currentTarget.style.boxShadow='0 12px 32px rgba(0,0,0,0.08)';}}

                  <h3 style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'22px', textTransform:'uppercase', color:'var(--black)', lineHeight:1.05, marginBottom:'8px' }}>{p.title}</h3>
                  <p style={{ fontSize:'13px', color:'var(--text-body)', lineHeight:1.7, marginBottom:'14px', flex:1 }}>{p.excerpt}</p>
                  <div style={{ display:'flex', alignItems:'center', gap:'8px', color:'var(--text-muted)', fontSize:'12px' }}>

function BlogPost({ post, onBack }) {

  return (
    <div style={{ animation:'slideUp 0.3s ease' }}>
      <section style={{ background:'var(--black)', padding:'56px 40px 80px', position:'relative', overflow:'hidden' }}>
        {post.photoId && (
          <div style={{ position:'absolute', inset:0, backgroundImage:`url('https://images.unsplash.com/photo-${post.photoId}?auto=format&fit=crop&w=1920&q=70')`, backgroundSize:'cover', backgroundPosition:'center', opacity:0.28 }}/>
        )}
        <div style={{ position:'absolute', inset:0, background:'linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.7) 50%, rgba(0,0,0,0.85) 100%)', pointerEvents:'none' }}/>
        <div style={{ maxWidth:'820px', margin:'0 auto', position:'relative' }}>
          <button onClick={onBack} style={{ background:'transparent', border:'none', color:'rgba(255,255,255,0.7)', fontSize:'13px', cursor:'pointer', marginBottom:'24px', display:'inline-flex', alignItems:'center', gap:'6px', padding:0, fontFamily:'DM Sans, sans-serif' }}>
            <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            All posts
          </button>
          <div style={{ marginBottom:'20px' }}><CategoryPill label={post.category}/></div>
          <h1 style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'clamp(36px,5vw,64px)', color:'white', textTransform:'uppercase', lineHeight:0.95, marginBottom:'20px' }}>{post.title}</h1>
          <div style={{ display:'flex', alignItems:'center', gap:'14px', color:'rgba(255,255,255,0.55)', fontSize:'14px' }}>
            <span style={{ color:'white', fontWeight:600 }}>{post.author}</span>
            <span>·</span><span>{post.date}</span>
            <span>·</span><span>{post.readTime}</span>
          </div>
        </div>
      </section>

      <section style={{ background:'var(--cream)', padding:'72px 40px 80px' }}>
        <div style={{ maxWidth:'820px', margin:'0 auto', display:'grid', gridTemplateColumns:'1fr 240px', gap:'48px', alignItems:'start' }}>
          <article style={{ fontSize:'17px', lineHeight:1.85, color:'var(--text-body)' }}>
            <p style={{ fontSize:'19px', fontWeight:500, color:'var(--text-body)', marginBottom:'24px', lineHeight:1.6 }}>{post.excerpt}</p>
            <p style={{ marginBottom:'20px' }}>
              Sample article body. In the real production version this would be filled with the actual content of <strong>{post.title}</strong> — written by the KBD shop team, edited for accuracy, illustrated with real photography from the Fullerton facility.
            </p>
            <h2 style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'30px', textTransform:'uppercase', color:'var(--black)', lineHeight:1, marginTop:'40px', marginBottom:'16px' }}>The Setup</h2>
            <p style={{ marginBottom:'20px' }}>
              Body copy continues here. Headlines use Barlow Condensed at 30px, body uses DM Sans at 17px with 1.85 line-height. Pull quotes and inline links keep the editorial-but-direct tone we use across the rest of the site.
            </p>
            <blockquote style={{ borderLeft:'3px solid var(--red)', paddingLeft:'24px', margin:'32px 0', fontFamily:'Barlow Condensed, sans-serif', fontWeight:700, fontSize:'24px', lineHeight:1.3, color:'var(--black)', fontStyle:'italic' }}>
              "Builder-to-builder, not marketing-to-customer. That's the voice we hold across every post on this blog."
            </blockquote>
            <h2 style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'30px', textTransform:'uppercase', color:'var(--black)', lineHeight:1, marginTop:'40px', marginBottom:'16px' }}>The Steps</h2>
            <ol style={{ paddingLeft:'24px', marginBottom:'20px' }}>
              <li style={{ marginBottom:'10px' }}>Wipe down with wax-and-grease remover. Don't skip this.</li>
              <li style={{ marginBottom:'10px' }}>Scuff with 220-grit until the entire surface is dulled — no shiny spots.</li>
              <li style={{ marginBottom:'10px' }}>Apply self-etching primer in light, even coats.</li>
              <li style={{ marginBottom:'10px' }}>Let cure overnight before color coat.</li>
              <li>Color coat in 3 light passes. Clearcoat per your booth's spec.</li>
            </ol>
            <p style={{ marginBottom:'20px' }}>
              That's the short version. Real production blog post would include photo callouts at each step, a parts/tools list, and a comments section moderated by the KBD team.
            </p>
          </article>

          <aside>
            <div style={{ background:'white', border:'1px solid var(--mid-grey)', borderRadius:'12px', padding:'20px', position:'sticky', top:'84px' }}>
              <div style={{ fontSize:'11px', letterSpacing:'0.15em', textTransform:'uppercase', color:'var(--red)', fontWeight:700, marginBottom:'10px' }}>Related Products</div>
              <p style={{ fontSize:'12px', color:'var(--text-muted)', lineHeight:1.6, marginBottom:'14px' }}>Kits referenced in this post:</p>
              {[{name:'VTX Front Bumper', price:319, vehicle:'350Z Z33'},{name:'Zenki Full Body Kit', price:699, vehicle:'240SX S14'}].map(p => (
                <div key={p.name} style={{ padding:'10px 0', borderBottom:'1px solid var(--mid-grey)' }}>
                  <div style={{ fontSize:'13px', fontWeight:700, color:'var(--black)', marginBottom:'2px' }}>{p.name}</div>
                  <div style={{ fontSize:'11px', color:'var(--text-muted)', marginBottom:'4px' }}>{p.vehicle}</div>
                  <div style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:800, fontSize:'18px', color:'var(--red)' }}>${p.price}</div>
                </div>
              ))}
              <a href="KBD_Results.html" style={{ display:'block', marginTop:'14px', background:'var(--red)', color:'white', padding:'10px', borderRadius:'8px', textDecoration:'none', fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'13px', textTransform:'uppercase', letterSpacing:'0.06em', textAlign:'center' }}>Shop Kits</a>
            </div>
          </aside>
        </div>
      </section>

      <section style={{ background:'white', padding:'56px 40px 80px', borderTop:'1px solid var(--mid-grey)' }}>
        <div style={{ maxWidth:'1200px', margin:'0 auto' }}>
          <div style={{ marginBottom:'24px' }}>
            <span style={{ width:'14px', height:'4px', background:'var(--red)', display:'inline-block', marginRight:'12px', verticalAlign:'middle' }}/>
            <span style={{ color:'var(--red)', fontSize:'11px', letterSpacing:'0.22em', textTransform:'uppercase', fontWeight:700 }}>Keep Reading</span>

                </div>

            ))}
          </div>
        </div>
      </section>

}

function BlogApp() {
  const [openPost, setOpenPost] = useState(null);
  function handleOpen(p) { setOpenPost(p); window.scrollTo({top:0,behavior:'smooth'}); }
  function handleBack(maybeP) {
    if (maybeP && maybeP.id) setOpenPost(maybeP);
    else setOpenPost(null);
  }
  return (
    <div>
      <Nav active="Blog"/>
      {openPost ? <BlogPost post={openPost} onBack={handleBack}/> : <BlogIndex onOpen={handleOpen}/>}
      <Footer/>
    </div>
  );
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"accentColor":"#CC0000"}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => {
    document.documentElement.style.setProperty('--red', tweaks.accentColor);
  }, [tweaks.accentColor]);
  return (
    <div>
      <TweaksPanel title="Tweaks">
        <TweakSection label="Brand"><TweakColor label="Accent" value={tweaks.accentColor} onChange={v=>setTweak('accentColor',v)}/></TweakSection>
      </TweaksPanel>
      <BlogApp/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
(function(){
  var mql = window.matchMedia("(max-width: 640px)");

  function applyMobile() {
    var isMobile = mql.matches;

    // Nav: hamburger + desktop-only
    var links = document.querySelector(".nav-links");
    if (links) links.style.display = isMobile ? "none" : "flex";
    var hamburger = document.querySelector(".nav-hamburger");
    if (hamburger) hamburger.style.display = isMobile ? "flex" : "none";
    document.querySelectorAll(".nav-desktop-only").forEach(function(el) {
      el.style.display = isMobile ? "none" : "";
    });

    // Collapse featured article (1.4fr 1fr → 1fr)
    var featuredGrid = document.querySelector('[style*="1.4fr 1fr"]');
    if (featuredGrid) featuredGrid.style.gridTemplateColumns = isMobile ? "1fr" : "1.4fr 1fr";

    // Collapse blog post layout (1fr 240px → 1fr)
    var postGrid = document.querySelector('[style*="1fr 240px"]');
    if (postGrid) postGrid.style.gridTemplateColumns = isMobile ? "1fr" : "1fr 240px";

    // Collapse related article cards (200px 1fr → 1fr)
    document.querySelectorAll('[style*="200px 1fr"]').forEach(function(el) {
      el.style.gridTemplateColumns = isMobile ? "1fr" : "200px 1fr";
    });

    // Collapse footer columns (1.6fr 1fr 1fr 1fr → 1fr)
    var footerGrid = document.querySelector('[style*="1.6fr 1fr 1fr 1fr"]');
    if (footerGrid) footerGrid.style.gridTemplateColumns = isMobile ? "1fr" : "1.6fr 1fr 1fr 1fr";
  }

  applyMobile();
  mql.addEventListener("change", applyMobile);
  var observer = new MutationObserver(applyMobile);
  observer.observe(document.body || document.documentElement, { childList: true, subtree: true });
})();
</script>
</body>
</html>
