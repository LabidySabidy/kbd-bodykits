<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About KBD — Our Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --red: #CC0000; --black: #0C0C0C; --off-white: #F7F6F4; --mid-grey: #E8E6E2; --text-muted: #7A7570; --text-body: #2A2825; --cream: #F5F2EC; }
  html { scroll-behavior: smooth; }
  body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text-body); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--red); color: white; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--off-white); }
  ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

  /* Batch 6 — responsive + a11y */
  @media (max-width: 900px) {
    /* Generic 3-column → 1-column collapse for product / build / blog grids */
    [style*="grid-template-columns: repeat(4,"], [style*="grid-template-columns:repeat(4,"],
    [style*="grid-template-columns: repeat(4,"], [style*="grid-template-columns:repeat(4,"],
    [style*="gridTemplateColumns: repeat(4", [style*="gridTemplateColumns:repeat(4"], [style*="gridTemplateColumns: repeat(3"], [style*="gridTemplateColumns:repeat(4"], [style*="gridTemplateColumns:repeat(4"], [style*="gridTemplateColumns:repeat(4"], [style*="gridTemplateColumns:repeat(3"] {
      grid-template-columns: 1fr !important;
    }
    /* Two-column layouts collapse to one */
    [style*="grid-template-columns: 1fr 1fr"], [style*="grid-template-columns:1fr 1fr"] {
      grid-template-columns: 1fr !important;
    }
    /* Drop the sticky sidebar position on small screens */
    [style*="position: sticky"], [style*="position:sticky"] {
      position: static !important;
    }
    /* Reduce nav padding on small screens */
    nav > div { padding: 0 16px !important; gap: 12px !important; }
    /* Page-level padding tighten */
    section, main, footer > div, .kbd-page { padding-left: 16px !important; padding-right: 16px !important; }
  }
  @media (max-width: 640px) {
    /* Drop nav items beyond logo + cart */
    nav [data-nav-link] { display: none !important; }
    /* Bigger tap targets */
    
  }

  /* 6.4 Focus-visible — visible keyboard focus, not on click */
  *:focus { outline: none; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
  textarea:focus-visible, [role="button"]:focus-visible {
    outline: 2px solid var(--red);
    outline-offset: 2px;
    border-radius: 4px;
  }
  /* Light-surface elements need a dark focus ring instead */
  input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline-color: var(--black);
  }

  /* 6.3 — Ensure body text on dark surfaces is at least rgba(255,255,255,0.7) */
  /* (handled per-element where critical; this is informational)*/

</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="kbd-shell.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

function AboutPage() {
  return (
    <div>
      <Nav active="About"/>

      {/* Hero */}
      <section style={{ background:'var(--black)', position:'relative', overflow:'hidden', padding:'96px 40px 80px' }}>
        <div style={{ position:'absolute', inset:0, backgroundImage:`url('https://images.unsplash.com/photo-1487480769727-0c01c8d362b6?auto=format&fit=crop&w=1920&q=60')`, backgroundSize:'cover', backgroundPosition:'center', opacity:0.22 }}/>
        <div style={{ position:'absolute', inset:0, background:'linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.45) 50%, rgba(0,0,0,0.75) 100%)', pointerEvents:'none' }}/>

        <div style={{ maxWidth:'1440px', margin:'0 auto', position:'relative' }}>
          <div style={{ display:'inline-flex', alignItems:'center', gap:'12px', marginBottom:'28px' }}>
            <span style={{ width:'14px', height:'4px', background:'var(--red)' }}/>
            <span style={{ color:'rgba(255,255,255,0.7)', fontSize:'11px', letterSpacing:'0.22em', textTransform:'uppercase', fontWeight:700 }}>Our Story</span>
          </div>
          <h1 style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'clamp(56px,8vw,108px)', color:'white', textTransform:'uppercase', lineHeight:0.88, marginBottom:'24px', letterSpacing:'-0.01em', maxWidth:'1100px' }}>
            Almost 50 Years of<br/>
            <span style={{ WebkitTextStroke:'1.5px rgba(255,255,255,0.3)', color:'transparent', fontStyle:'italic' }}>Made-in-USA</span>{' '}
            <span style={{ color:'var(--red)' }}>Body Panels.</span>
          </h1>
          <p style={{ color:'rgba(255,255,255,0.55)', fontSize:'17px', lineHeight:1.75, maxWidth:'620px' }}>
            From a single mold in a Fullerton garage to one of the most trusted polyurethane body kit manufacturers in the country. The KBD story is built on customer demand, in-house manufacturing, and a refusal to compromise on material.
          </p>

          <div style={{ display:'flex', gap:'40px', marginTop:'48px' }}>
            {[['~50','Years Manufacturing'],['Hundreds','Vehicle Applications'],['100%','In-House Production']].map(([n,l]) => (
              <div key={l}>
                <div style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'52px', color:'var(--red)', lineHeight:1 }}>{n}</div>
                <div style={{ color:'rgba(255,255,255,0.5)', fontSize:'12px', fontWeight:600, letterSpacing:'0.1em', textTransform:'uppercase', marginTop:'4px' }}>{l}</div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* 3-section editorial */}
      <section style={{ background:'var(--cream)', padding:'100px 40px' }}>
        <div style={{ maxWidth:'1100px', margin:'0 auto' }}>
          {/* Section 01 — Origin */}
          <article style={{ display:'grid', gridTemplateColumns:'140px 1fr', gap:'40px', alignItems:'start', marginBottom:'80px' }}>
            <div>
              <div style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'72px', color:'var(--red)', lineHeight:1 }}>01</div>
              <div style={{ width:'40px', height:'3px', background:'var(--red)', marginTop:'8px' }}/>
            </div>
            <div>
              <div style={{ fontSize:'11px', letterSpacing:'0.2em', textTransform:'uppercase', color:'var(--red)', fontWeight:700, marginBottom:'12px' }}>Origin</div>
              <h2 style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'clamp(36px,4vw,56px)', textTransform:'uppercase', color:'var(--black)', lineHeight:0.95, marginBottom:'20px' }}>
                Started in a garage. Stayed independent.
              </h2>
              <p style={{ fontSize:'16px', lineHeight:1.85, color:'var(--text-body)', maxWidth:'720px', marginBottom:'16px' }}>
                KBD Body Kits operates under American Plastic Technologies — a manufacturer that's been working with polyurethane formulations for almost five decades. The shop has always been in Orange County, California, and the molds have always been our own.
              </p>
              <p style={{ fontSize:'16px', lineHeight:1.85, color:'var(--text-body)', maxWidth:'720px' }}>
                No license-and-resell. No off-the-shelf catalog from overseas. Every style — Kyouki, Zenki, PMZ, Deuce, Stalker, 2Fordy — was designed, prototyped, molded, and shipped from the same Fullerton facility. Almost 50 years of doing it the same way: in-house.
              </p>
            </div>
          </article>

          {/* Section 02 — Material */}
          <article style={{ display:'grid', gridTemplateColumns:'140px 1fr', gap:'40px', alignItems:'start', marginBottom:'80px' }}>
            <div>
              <div style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'72px', color:'var(--red)', lineHeight:1 }}>02</div>
              <div style={{ width:'40px', height:'3px', background:'var(--red)', marginTop:'8px' }}/>
            </div>
            <div>
              <div style={{ fontSize:'11px', letterSpacing:'0.2em', textTransform:'uppercase', color:'var(--red)', fontWeight:700, marginBottom:'12px' }}>The Material</div>
              <h2 style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'clamp(36px,4vw,56px)', textTransform:'uppercase', color:'var(--black)', lineHeight:0.95, marginBottom:'20px' }}>
                Polyurethane flexes.<br/>Fiberglass shatters.
              </h2>
              <p style={{ fontSize:'16px', lineHeight:1.85, color:'var(--text-body)', maxWidth:'720px', marginBottom:'16px' }}>
                Walk into most aftermarket body shops and the kits on the wall are fiberglass. Lightweight, cheap to manufacture, brittle on impact. One parking-lot kiss and the whole bumper spider-cracks.
              </p>
              <p style={{ fontSize:'16px', lineHeight:1.85, color:'var(--text-body)', maxWidth:'720px', marginBottom:'24px' }}>
                Our proprietary polyurethane formula does the opposite. The kit flexes on impact and returns to its original shape — like rubber. Heat, cold, parking blocks, low driveways, missed apexes. It absorbs and recovers.
              </p>
              {/* Side-by-side compare */}
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px', maxWidth:'720px' }}>
                <div style={{ background:'white', border:'1px solid var(--mid-grey)', borderRadius:'12px', padding:'18px 20px' }}>
                  <div style={{ fontSize:'10px', letterSpacing:'0.15em', textTransform:'uppercase', color:'var(--text-muted)', fontWeight:600, marginBottom:'8px' }}>KBD Polyurethane</div>
                  <div style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'24px', color:'var(--black)', textTransform:'uppercase', marginBottom:'10px', lineHeight:1.05 }}>Flexes & Returns</div>
                  <ul style={{ listStyle:'none', padding:0, fontSize:'13px', color:'var(--text-body)', lineHeight:1.8 }}>
                    <li>✓ Survives impact</li>
                    <li>✓ Holds paint cleanly</li>
                    <li>✓ Limited Lifetime Warranty</li>
                  </ul>
                </div>
                <div style={{ background:'white', border:'1px solid var(--mid-grey)', borderRadius:'12px', padding:'18px 20px', opacity:0.7 }}>
                  <div style={{ fontSize:'10px', letterSpacing:'0.15em', textTransform:'uppercase', color:'var(--text-muted)', fontWeight:600, marginBottom:'8px' }}>Typical Fiberglass</div>
                  <div style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'24px', color:'var(--text-muted)', textTransform:'uppercase', marginBottom:'10px', lineHeight:1.05 }}>Cracks & Stays Cracked</div>
                  <ul style={{ listStyle:'none', padding:0, fontSize:'13px', color:'var(--text-muted)', lineHeight:1.8 }}>
                    <li>✗ Spider-cracks on tap</li>
                    <li>✗ Heat warps panels</li>
                    <li>✗ One-time use</li>
                  </ul>
                </div>
              </div>
            </div>
          </article>

          {/* Section 03 — Promise */}
          <article style={{ display:'grid', gridTemplateColumns:'140px 1fr', gap:'40px', alignItems:'start' }}>
            <div>
              <div style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'72px', color:'var(--red)', lineHeight:1 }}>03</div>
              <div style={{ width:'40px', height:'3px', background:'var(--red)', marginTop:'8px' }}/>
            </div>
            <div>
              <div style={{ fontSize:'11px', letterSpacing:'0.2em', textTransform:'uppercase', color:'var(--red)', fontWeight:700, marginBottom:'12px' }}>The Promise</div>
              <h2 style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'clamp(36px,4vw,56px)', textTransform:'uppercase', color:'var(--black)', lineHeight:0.95, marginBottom:'20px' }}>
                Limited Lifetime Warranty.<br/>Commitment, not marketing.
              </h2>
              <p style={{ fontSize:'16px', lineHeight:1.85, color:'var(--text-body)', maxWidth:'720px', marginBottom:'16px' }}>
                Every KBD kit ships backed by our <strong>Limited Lifetime Warranty</strong>. If a part fails under normal use, we replace it. Not a year, not five — the life of the kit. It's the warranty that lets us sleep at night, and it's the one Irving will personally back up if you call the shop.
              </p>
              <p style={{ fontSize:'16px', lineHeight:1.85, color:'var(--text-body)', maxWidth:'720px' }}>
                We don't write that promise because every other manufacturer does. We write it because we mold the parts ourselves and we trust the material. That's the difference.
              </p>
            </div>
          </article>
        </div>
      </section>

      {/* Visit Our Facility CTA */}
      <section style={{ background:'var(--black)', padding:'80px 40px', position:'relative', overflow:'hidden' }}>
        <div style={{ position:'absolute', right:'5%', top:'50%', transform:'translateY(-50%)', width:'400px', height:'200px', background:'radial-gradient(ellipse, oklch(0.48 0.22 25 / 0.12) 0%, transparent 70%)', pointerEvents:'none' }}/>
        <div style={{ maxWidth:'1100px', margin:'0 auto', display:'grid', gridTemplateColumns:'1fr auto', gap:'40px', alignItems:'center', position:'relative' }}>
          <div>
            <div style={{ display:'inline-flex', alignItems:'center', gap:'12px', marginBottom:'18px' }}>
              <span style={{ width:'14px', height:'4px', background:'var(--red)' }}/>
              <span style={{ color:'rgba(255,255,255,0.6)', fontSize:'11px', letterSpacing:'0.22em', textTransform:'uppercase', fontWeight:700 }}>Come See For Yourself</span>
            </div>
            <h2 style={{ fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'clamp(34px,4vw,52px)', color:'white', textTransform:'uppercase', lineHeight:0.95, marginBottom:'14px' }}>
              Visit Our Fullerton Facility
            </h2>
            <p style={{ color:'rgba(255,255,255,0.55)', fontSize:'15px', lineHeight:1.75, maxWidth:'520px' }}>
              The mold room, the paint booth, the parts shelves. Local builders are welcome — call ahead, swing by, walk through the process.
            </p>
            <a href="tel:18773993794" style={{ display:'inline-block', marginTop:'14px', fontFamily:'Barlow Condensed, sans-serif', fontWeight:800, fontSize:'22px', color:'white', textDecoration:'none', letterSpacing:'0.04em' }}>
              (877) 399-3794
            </a>
          </div>
          <a href="#" style={{ background:'var(--red)', color:'white', padding:'16px 32px', borderRadius:'10px', textDecoration:'none', fontFamily:'Barlow Condensed, sans-serif', fontWeight:900, fontSize:'18px', textTransform:'uppercase', letterSpacing:'0.06em', whiteSpace:'nowrap', display:'flex', alignItems:'center', gap:'10px' }}>
            Get In Touch
            <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </a>
        </div>
      </section>

      <Footer/>
    </div>
  );
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"accentColor":"#CC0000"}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => {
    document.documentElement.style.setProperty('--red', tweaks.accentColor);
  }, [tweaks.accentColor]);

  return (
    <div>
      <TweaksPanel title="Tweaks">
        <TweakSection label="Brand">
          <TweakColor label="Accent" value={tweaks.accentColor} onChange={v=>setTweak('accentColor',v)}/>
        </TweakSection>
      </TweaksPanel>
      <AboutPage/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
