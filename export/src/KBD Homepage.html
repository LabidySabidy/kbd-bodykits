const UNSPLASH = (id, w=800) => (window.__resources && window.__resources['img_'+id.replace(/[^a-z0-9]/gi,'_')]) || `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=${w}&q=82`;

function PlaceholderImg({ label, aspect='3/2', dark=false, unsplashId=null, w=800 }) {
  const [err, setErr] = React.useState(false);
  if (unsplashId && !err) {
    return (
      <div style={{position:'relative',width:'100%',aspectRatio:aspect,overflow:'hidden',background:dark?'#1a1a1a':'#e0ddd8'}}>
        <img src={UNSPLASH(unsplashId,w)} alt={label} onError={()=>setErr(true)}
          style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>
      </div>
    );
  }
  const lines = [];
  for(let i=0;i<20;i++) lines.push(i);
  return (
    <div style={{
      position:'relative', width:'100%', aspectRatio:aspect,
      background: dark ? '#1a1a1a' : '#e8e5e0',
      overflow:'hidden', display:'flex', alignItems:'center', justifyContent:'center'
    }}>
      <svg style={{position:'absolute',inset:0,width:'100%',height:'100%'}} preserveAspectRatio="none">
        {lines.map(i=>(
          <line key={i} x1={i*6+'%'} y1="0" x2={i*6+'%'} y2="100%"
            stroke={dark?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.06)'} strokeWidth="1"/>

        textAlign:'center', padding:'8px', position:'relative', textTransform:'uppercase'
      }}>{label}</span>
    </div>
  );
}

    const t = setInterval(() => setIdx(i => (i+1) % messages.length), 3500);

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#CC0000",

  "showInstagram": true,
  "showCrossSell": true,
  "heroStyle": "grid"
}/*EDITMODE-END*/;

// ─── APP ───────────────────────────────────────────────────────────────────
function App() {
  const result = useTweaks(TWEAK_DEFAULTS);
  const tweaks = (result && result.tweaks) ? result.tweaks : TWEAK_DEFAULTS;
  const TweaksUI = result ? result.TweaksUI : null;

  useEffect(() => {
    const root = document.documentElement;
    root.style.setProperty('--red', tweaks.accentColor);
    root.style.setProperty('--red-bright', tweaks.accentColor);
  }, [tweaks.accentColor]);

  return (
    <div>
      {TweaksUI && (
        <TweaksUI>
          <TweakSection label="Brand">
            <TweakColor id="accentColor" label="Accent Color"/>
          </TweakSection>
          <TweakSection label="Sections">
            <TweakToggle id="showInstagram" label="Instagram Feed"/>
            <TweakToggle id="showCrossSell" label="Cross-sell Bar"/>
          </TweakSection>
        </TweaksUI>
      )}
      <AnnouncementBar/>
      <Nav tweaks={tweaks}/>
      <Hero tweaks={tweaks}/>
      <TrustBar/>
      <CategoryGrid/>
      <FeaturedProducts tweaks={tweaks}/>
      <WhyKBD/>
      <ShowUsYourRideBanner/>
      <BuildGallery/>
      <WillMakeItBanner/>
      <Reviews/>
      <Footer/>
    </div>
  );
}
